order-radius:8px;padding:10px 12px;text-align:left;font-size:1rem}.option.teacher-answer.show-answer{background:var(--okbg);border-color:var(--ok);color:#0f5528;font-weight:900}.option.correct{background:var(--okbg);border-color:var(--ok);color:#0f5528;font-weight:900}.option.wrong{background:var(--badbg);border-color:var(--bad);color:#8f1919}.explain{display:none;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}.explain.show{display:block}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.btn{border:0;border-radius:8px;background:var(--red);color:white;padding:12px 16px;font-weight:900}.btn.secondary{background:var(--beige);color:var(--burgundy)}.result{display:none;background:var(--burgundy);color:white;border-radius:10px;padding:16px;margin:18px 0}.result.show{display:block}.index-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.lesson-link{display:block;text-decoration:none;color:var(--text);background:white;border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:0 10px 28px rgba(82,45,29,.08)}.lesson-link b{color:var(--burgundy);font-size:1.1rem}.review-link{border-color:#d8b07a;background:#fffaf1}@media(max-width:860px){.vocab-body{grid-template-columns:1fr}.vocab-side{order:-1}.vocab .hanzi{font-size:clamp(4rem,18vw,6rem)}.vocab-image{min-height:180px}.vocab-image img{min-height:180px}.grammar-detail,.grammar-examples{grid-template-columns:1fr}}@media(max-width:760px){.index-grid{grid-template-columns:1fr}.dialogue .turn{grid-template-columns:36px 1fr}.hero{padding:26px 0}.section-title{display:block}.topnav a{font-size:.86rem}.card{padding:14px}.vocab{padding:0}.vocab-body{padding:14px}.turn-cn{font-size:1.16rem}.stroke-grid{grid-template-columns:repeat(auto-fit,minmax(128px,1fr))}.practice-tools{top:48px;justify-content:stretch}.practice-tools button{flex:1}.exercise-top{display:block}.teacher-badge{display:inline-block;margin-top:8px}}

<script>
const quizData=[{"section":"Điền từ","type":"fill","prompt":"我______是医生。 Wǒ māma shì yīshēng. Mẹ tôi là bác sĩ.","options":["售货员","妈妈","一共","十"],"answer":1,"explanation":"Câu đầy đủ là “我妈妈是医生。”.","source":"Bài 10"},{"section":"Từ vựng","type":"meaning","prompt":"“到” nghĩa là gì?","options":["hào","cuối tuần","em gái","đến, tới"],"answer":3,"explanation":"“到” đọc là dào, nghĩa là “đến, tới”.","source":"Bài 8"},{"section":"Pinyin","type":"pinyin","prompt":"Pinyin đúng của “里” là gì?","options":["lǐ","yíhuìr","zìxíngchē","yī"],"answer":0,"explanation":"Pinyin của “里” là lǐ.","source":"Bài 7"},{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “đi/cưỡi xe, ngựa”?","options":["下课","骑","半","分"],"answer":1,"explanation":"Đáp án đúng là “骑”, đọc là qí.","source":"Bài 8"},{"section":"Bài khóa","type":"textbook","prompt":"Câu “号码是多少？” nghĩa là gì? Hàomǎ shì duōshao?","options":["Số là bao nhiêu?","Mary, tối nay bạn có thời gian không?","Ở phía đông nam của trường, là tòa Đông số 5.","Tôi không biết tên, nhưng nghe nói rất nổi tiếng."],"answer":0,"explanation":"“号码是多少？” nghĩa là “Số là bao nhiêu?”.","source":"Bài 8"},{"section":"Điền từ","type":"fill","prompt":"她______两瓶水。 Tā mǎi liǎng píng shuǐ. Cô ấy mua hai chai nước.","options":["买","分钟","下","都"],"answer":0,"explanation":"Câu đầy đủ là “她买两瓶水。”.","source":"Bài 9"},{"section":"Ngữ pháp","type":"grammar","prompt":"Giải thích này thuộc điểm ngữ pháp nào? Số phòng/số điện thoại thường đọc từng chữ số.","options":["呢（2）","钟点表达法","号码表达法","数字表达法"],"answer":2,"explanation":"Điểm ngữ pháp là “号码表达法”.","source":"Bài 10"},{"section":"Từ vựng","type":"meaning","prompt":"“啊” nghĩa là gì?","options":["a, à, hả","số tám","nhanh","buổi sáng"],"answer":0,"explanation":"“啊” đọc là a, nghĩa là “a, à, hả”.","source":"Bài 8"},{"section":"Điền từ","type":"fill","prompt":"______个学生在教室里。 Jiǔ ge xuésheng zài jiàoshì li. Chín học sinh ở trong lớp học.","options":["这些","九","东","要"],"answer":1,"explanation":"Câu đầy đủ là “九个学生在教室里。”.","source":"Bài 6"},{"section":"Từ vựng","type":"meaning","prompt":"“周末” nghĩa là gì?","options":["cuối tuần","còn, vẫn","quyển, lượng từ của sách vở","số chín"],"answer":0,"explanation":"“周末” đọc là zhōumò, nghĩa là “cuối tuần”.","source":"Bài 8"},{"section":"Bài khóa","type":"textbook","prompt":"Câu “北京大学早上八点上课，太早了。” nghĩa là gì? Běijīng Dàxué zǎoshang bā diǎn shàng kè, tài zǎo le.","options":["Hai mươi hai đồng.","Đại học Bắc Kinh buổi sáng tám giờ vào lớp, sớm quá.","Phần lớn là chín giờ, trường chúng tôi là tám giờ năm mươi.","Xe buýt số 21 và 106 đều đến. Đi xe đạp cũng nhanh, mười lăm phút là tới."],"answer":1,"explanation":"“北京大学早上八点上课，太早了。” nghĩa là “Đại học Bắc Kinh buổi sáng tám giờ vào lớp, sớm quá.”.","source":"Bài 6"},{"section":"Ngữ pháp","type":"grammar","prompt":"Giải thích này thuộc điểm ngữ pháp nào? Một số danh từ có lượng từ chuyên dùng, ví dụ 瓶, 本, 辆, 把, 位.","options":["量词","吧（1）","号码表达法","“几”和“多少”（2）"],"answer":0,"explanation":"Điểm ngữ pháp là “量词”.","source":"Bài 9"},{"section":"Ngữ pháp","type":"grammar","prompt":"Giải thích này thuộc điểm ngữ pháp nào? Dùng 有 để nói ai/cái gì có cái gì.","options":["钱数表达法","“有”字句","数字表达法","吧（2）"],"answer":1,"explanation":"Điểm ngữ pháp là ““有”字句”.","source":"Bài 10"},{"section":"Pinyin","type":"pinyin","prompt":"Pinyin đúng của “零钱” là gì?","options":["língqián","kuài","gǒu","zěnme"],"answer":0,"explanation":"Pinyin của “零钱” là língqián.","source":"Bài 9"},{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “nhưng”?","options":["小","看","可是","妹妹"],"answer":2,"explanation":"Đáp án đúng là “可是”, đọc là kěshì.","source":"Bài 7"},{"section":"Bài khóa","type":"textbook","prompt":"Câu “21路和106路公共汽车都到。骑自行车也很快，十五分钟就到。” nghĩa là gì? Èrshíyī lù hé yāo líng liù lù gōnggòng qìchē dōu dào. Qí zìxíngchē yě hěn kuài, shíwǔ fēnzhōng jiù dào.","options":["Xe buýt số 21 và 106 đều đến. Đi xe đạp cũng nhanh, mười lăm phút là tới.","Tôi mua hai chai, lại mua thêm hai chai nước.","Không, hiện nay gia đình Trung Quốc thường chỉ có một con. Mary, nhà bạn có những ai?","13695670132."],"answer":0,"explanation":"“21路和106路公共汽车都到。骑自行车也很快，十五分钟就到。” nghĩa là “Xe buýt số 21 và 106 đều đến. Đi xe đạp cũng nhanh, mười lăm phút là tới.”.","source":"Bài 8"},{"section":"Từ vựng","type":"meaning","prompt":"“刻” nghĩa là gì?","options":["em trai","lên lớp, đi học","15 phút","trường đại học"],"answer":2,"explanation":"“刻” đọc là kè, nghĩa là “15 phút”.","source":"Bài 6"},{"section":"Pinyin","type":"pinyin","prompt":"Pinyin đúng của “爸爸” là gì?","options":["bàba","xiàwǔ","diànyǐngyuàn","lǐ"],"answer":0,"explanation":"Pinyin của “爸爸” là bàba.","source":"Bài 10"},{"section":"Từ vựng","type":"meaning","prompt":"“电影院” nghĩa là gì?","options":["rạp chiếu phim","đồng, đơn vị tiền Trung Quốc","buổi sáng","hôm nay"],"answer":0,"explanation":"“电影院” đọc là diànyǐngyuàn, nghĩa là “rạp chiếu phim”.","source":"Bài 7"},{"section":"Từ vựng","type":"meaning","prompt":"“室” nghĩa là gì?","options":["phòng, buồng","anh trai, anh","trong, ở trong","đương nhiên, tất nhiên"],"answer":0,"explanation":"“室” đọc là shì, nghĩa là “phòng, buồng”.","source":"Bài 8"},{"section":"Điền từ","type":"fill","prompt":"我的______在东边。 Wǒ de dàxué zài dōngbian. Trường đại học của tôi ở phía đông.","options":["东南","电话","大学","钱"],"answer":2,"explanation":"Câu đầy đủ là “我的大学在东边。”.","source":"Bài 6"},{"section":"Từ vựng","type":"meaning","prompt":"“上课” nghĩa là gì?","options":["tan học","bố, cha","số chín","lên lớp, đi học"],"answer":3,"explanation":"“上课” đọc là shàng kè, nghĩa là “lên lớp, đi học”.","source":"Bài 6"},{"section":"Từ vựng","type":"meaning","prompt":"“听说” nghĩa là gì?","options":["như thế nào","nghe nói","giờ","con, lượng từ"],"answer":1,"explanation":"“听说” đọc là tīngshuō, nghĩa là “nghe nói”.","source":"Bài 7"},{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “tiền lẻ”?","options":["给","零钱","这些","电影院"],"answer":1,"explanation":"Đáp án đúng là “零钱”, đọc là língqián.","source":"Bài 9"},{"section":"Từ vựng","type":"meaning","prompt":"“一共” nghĩa là gì?","options":["rạp chiếu phim","đi/cưỡi xe, ngựa","số, mã số","tất cả, tổng cộng"],"answer":3,"explanation":"“一共” đọc là yígòng, nghĩa là “tất cả, tổng cộng”.","source":"Bài 9"},{"section":"Điền từ","type":"fill","prompt":"你______这些词典。 Nǐ kàn zhèxiē cídiǎn. Bạn xem những quyển từ điển này.","options":["看","口","明天","条"],"answer":0,"explanation":"Câu đầy đủ là “你看这些词典。”.","source":"Bài 9"},{"section":"Từ vựng","type":"meaning","prompt":"“见” nghĩa là gì?","options":["quyển, lượng từ của sách vở","rạp chiếu phim","gặp, thấy","như thế nào"],"answer":2,"explanation":"“见” đọc là jiàn, nghĩa là “gặp, thấy”.","source":"Bài 6"},{"section":"Điền từ","type":"fill","prompt":"我们学习第一______。 Wǒmen xuéxí dì-yī bùfen. Chúng tôi học phần thứ nhất.","options":["部分","东","售货员","当然"],"answer":0,"explanation":"Câu đầy đủ là “我们学习第一部分。”.","source":"Bài 6"},{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “sớm”?","options":["早","等","十","妈妈"],"answer":0,"explanation":"Đáp án đúng là “早”, đọc là zǎo.","source":"Bài 6"},{"section":"Bài khóa","type":"textbook","prompt":"Câu “这是你的照片吗？” nghĩa là gì? Zhè shì nǐ de zhàopiàn ma?","options":["Đây là ảnh của bạn à?","Không vấn đề, tôi có. Đây là chìa khóa, xe ở nhà để xe dưới lầu.","Tất nhiên tôi đi.","Đúng, là ảnh nhà tôi."],"answer":0,"explanation":"“这是你的照片吗？” nghĩa là “Đây là ảnh của bạn à?”.","source":"Bài 10"},{"section":"Ngữ pháp","type":"grammar","prompt":"Giải thích này thuộc điểm ngữ pháp nào? 几 thường hỏi số ít; 多少 hỏi số nhiều hơn hoặc giá tiền.","options":["钟点表达法","“有”字句","“几”和“多少”（2）","吧（2）"],"answer":2,"explanation":"Điểm ngữ pháp là ““几”和“多少”（2）”.","source":"Bài 10"},{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “nhỏ, bé”?","options":["走","家","小","车"],"answer":2,"explanation":"Đáp án đúng là “小”, đọc là xiǎo.","source":"Bài 9"},{"section":"Bài khóa","type":"textbook","prompt":"Câu “没有，不过我朋友有。” nghĩa là gì? Méiyǒu, búguò wǒ péngyou yǒu.","options":["Số là bao nhiêu?","Xe buýt số 21 và 106 đều đến. Đi xe đạp cũng nhanh, mười lăm phút là tới.","Không có, nhưng bạn tôi có.","Đây là ảnh của bạn à?"],"answer":2,"explanation":"“没有，不过我朋友有。” nghĩa là “Không có, nhưng bạn tôi có.”.","source":"Bài 8"},{"section":"Ngữ pháp","type":"grammar","prompt":"Giải thích này thuộc điểm ngữ pháp nào? Các từ 上、下、里、外、前、后、左、右、旁边... có thể đặt sau danh từ để biểu thị vị trí.","options":["方位名词（2）","吧（1）","“几”和“多少”（2）","“有”字句"],"answer":0,"explanation":"Điểm ngữ pháp là “方位名词（2）”.","source":"Bài 7"},{"section":"Pinyin","type":"pinyin","prompt":"Pinyin đúng của “我们” là gì?","options":["wǒmen","zhèyàng","shàngwǔ","bàba"],"answer":0,"explanation":"Pinyin của “我们” là wǒmen.","source":"Bài 6"},{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “nhà, gia đình”?","options":["可是","时间","家","零钱"],"answer":2,"explanation":"Đáp án đúng là “家”, đọc là jiā.","source":"Bài 10"},{"section":"Pinyin","type":"pinyin","prompt":"Pinyin đúng của “号” là gì?","options":["shòuhuòyuán","háizi","hào","jiǎngzuò"],"answer":2,"explanation":"Pinyin của “号” là hào.","source":"Bài 8"},{"section":"Ngữ pháp","type":"grammar","prompt":"Giải thích này thuộc điểm ngữ pháp nào? 吧 có thể diễn tả suy đoán nhẹ hoặc hỏi xác nhận.","options":["吧（1）","几 / 多少（1）","吧（2）","“二”和“两”"],"answer":0,"explanation":"Điểm ngữ pháp là “吧（1）”.","source":"Bài 10"},{"section":"Từ vựng","type":"meaning","prompt":"“妹妹” nghĩa là gì?","options":["em gái","nhỏ, bé","cho, giao cho","tiền"],"answer":0,"explanation":"“妹妹” đọc là mèimei, nghĩa là “em gái”.","source":"Bài 10"},{"section":"Từ vựng","type":"meaning","prompt":"“晚上” nghĩa là gì?","options":["nghe nói","rạp chiếu phim","buổi tối","phòng, buồng"],"answer":2,"explanation":"“晚上” đọc là wǎnshang, nghĩa là “buổi tối”.","source":"Bài 7"},{"section":"Pinyin","type":"pinyin","prompt":"Pinyin đúng của “这样” là gì?","options":["zhèyàng","yī","diànyǐngyuàn","yǒumíng"],"answer":0,"explanation":"Pinyin của “这样” là zhèyàng.","source":"Bài 10"},{"section":"Bài khóa","type":"textbook","prompt":"Câu “大部分是九点，我们学校是八点五十分。” nghĩa là gì? Dà bùfen shì jiǔ diǎn, wǒmen xuéxiào shì bā diǎn wǔshí fēn.","options":["Không có, nhưng bạn tôi có.","Thì ra là vậy...","Phần lớn là chín giờ, trường chúng tôi là tám giờ năm mươi.","Không vấn đề, tôi có. Đây là chìa khóa, xe ở nhà để xe dưới lầu."],"answer":2,"explanation":"“大部分是九点，我们学校是八点五十分。” nghĩa là “Phần lớn là chín giờ, trường chúng tôi là tám giờ năm mươi.”.","source":"Bài 6"},{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “số năm mươi”?","options":["快","弟弟","五十","后边"],"answer":2,"explanation":"Đáp án đúng là “五十”, đọc là wǔshí.","source":"Bài 6"},{"section":"Ngữ pháp","type":"grammar","prompt":"Giải thích này thuộc điểm ngữ pháp nào? Đơn vị Nhân dân tệ là 元、角、分; trong khẩu ngữ thường nói 块、毛、分.","options":["钱数表达法","“有”字句","“二”和“两”","时间名词做状语"],"answer":0,"explanation":"Điểm ngữ pháp là “钱数表达法”.","source":"Bài 9"},{"section":"Điền từ","type":"fill","prompt":"中国家庭______有一个孩子。 Zhōngguó jiātíng yìbān yǒu yí ge háizi. Gia đình Trung Quốc thường có một con.","options":["一般","十","早","刻"],"answer":0,"explanation":"Câu đầy đủ là “中国家庭一般有一个孩子。”.","source":"Bài 10"},{"section":"Ngữ pháp","type":"grammar","prompt":"Giải thích này thuộc điểm ngữ pháp nào? Thời gian thường đặt trước động từ hoặc trước chủ ngữ.","options":["钟点表达法","吧（2）","时间名词做状语","号码表达法"],"answer":2,"explanation":"Điểm ngữ pháp là “时间名词做状语”.","source":"Bài 10"},{"section":"Pinyin","type":"pinyin","prompt":"Pinyin đúng của “孩子” là gì?","options":["háizi","dà bùfen","zhǐ","mǎi"],"answer":0,"explanation":"Pinyin của “孩子” là háizi.","source":"Bài 10"},{"section":"Điền từ","type":"fill","prompt":"______个学生在宿舍。 Liù ge xuésheng zài sùshè. Sáu học sinh ở ký túc xá.","options":["还","刻","六","电影"],"answer":2,"explanation":"Câu đầy đủ là “六个学生在宿舍。”.","source":"Bài 6"},{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “thời gian”?","options":["时间","几","车棚","这些"],"answer":0,"explanation":"Đáp án đúng là “时间”, đọc là shíjiān.","source":"Bài 7"},{"section":"Pinyin","type":"pinyin","prompt":"Pinyin đúng của “上午” là gì?","options":["qián","jiātíng","shàngwǔ","tīngshuō"],"answer":2,"explanation":"Pinyin của “上午” là shàngwǔ.","source":"Bài 7"}];const letters=["A","B","C","D"];const state={};
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
function render(){const root=document.getElementById("quiz");let section="";root.innerHTML="";quizData.forEach((q,i)=>{if(q.section!==section){section=q.section;root.insertAdjacentHTML("beforeend",'<div class="section-title"><h2>'+esc(section)+'</h2><span></span></div>')}const opts=q.options.map((o,j)=>'<label class="option" id="q-'+i+'-o-'+j+'"><input type="radio" name="q-'+i+'" onchange="state['+i+']='+j+'"> <span><b>'+letters[j]+'.</b> '+esc(o)+'</span></label>').join("");root.insertAdjacentHTML("beforeend",'<article class="card" id="q-'+i+'"><div class="meta">Câu '+(i+1)+' · '+esc(q.type)+' · '+esc(q.source)+'</div><div class="exercise-q">'+esc(q.prompt)+'</div><div class="options">'+opts+'</div><div class="explain" id="q-'+i+'-ex"></div></article>')})}
function submitQuiz(){let correct=0;quizData.forEach((q,i)=>{const selected=state[i];q.options.forEach((_,j)=>{const el=document.getElementById("q-"+i+"-o-"+j);el.classList.remove("correct","wrong");if(j===q.answer)el.classList.add("correct");if(selected===j&&selected!==q.answer)el.classList.add("wrong")});if(selected===q.answer)correct++;const ex=document.getElementById("q-"+i+"-ex");ex.innerHTML='<b>'+(selected===q.answer?'Đúng':'Chưa đúng')+'.</b><br>Bạn chọn: '+esc(selected===undefined?'Chưa chọn':letters[selected]+'. '+q.options[selected])+'<br>Đáp án đúng: '+esc(letters[q.answer]+'. '+q.options[q.answer])+'<br>Giải thích: '+esc(q.explanation);ex.classList.add("show")});const pct=Math.round(correct/quizData.length*100);const r=document.getElementById("result");r.innerHTML='<b>'+correct+'/'+quizData.length+' câu đúng · '+pct+'%</b><br>Đáp án và giải thích đã hiện dưới từng câu.';r.classList.add("show");r.scrollIntoView({behavior:"smooth",block:"center"})}
function resetQuiz(){for(const k of Object.keys(state))delete state[k];document.querySelectorAll("input").forEach(i=>i.checked=false);document.querySelectorAll(".option").forEach(o=>o.classList.remove("correct","wrong"));document.querySelectorAll(".explain").forEach(e=>{e.classList.remove("show");e.innerHTML=""});document.getElementById("result").classList.remove("show");scrollTo({top:0,behavior:"smooth"})}
render();
</script>
