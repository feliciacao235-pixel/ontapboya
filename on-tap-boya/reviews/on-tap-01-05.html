;const letters=["A","B","C","D"];const state={};
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
function render(){const root=document.getElementById("quiz");let section="";root.innerHTML="";quizData.forEach((q,i)=>{if(q.section!==section){section=q.section;root.insertAdjacentHTML("beforeend",'<div class="section-title"><h2>'+esc(section)+'</h2><span></span></div>')}const opts=q.options.map((o,j)=>'<label class="option" id="q-'+i+'-o-'+j+'"><input type="radio" name="q-'+i+'" onchange="state['+i+']='+j+'"> <span><b>'+letters[j]+'.</b> '+esc(o)+'</span></label>').join("");root.insertAdjacentHTML("beforeend",'<article class="card" id="q-'+i+'"><div class="meta">Câu '+(i+1)+' · '+esc(q.type)+' · '+esc(q.source)+'</div><div class="exercise-q">'+esc(q.prompt)+'</div><div class="options">'+opts+'</div><div class="explain" id="q-'+i+'-ex"></div></article>')})}
function submitQuiz(){let correct=0;quizData.forEach((q,i)=>{const selected=state[i];q.options.forEach((_,j)=>{const el=document.getElementById("q-"+i+"-o-"+j);el.classList.remove("correct","wrong");if(j===q.answer)el.classList.add("correct");if(selected===j&&selected!==q.answer)el.classList.add("wrong")});if(selected===q.answer)correct++;const ex=document.getElementById("q-"+i+"-ex");ex.innerHTML='<b>'+(selected===q.answer?'Đúng':'Chưa đúng')+'.</b><br>Bạn chọn: '+esc(selected===undefined?'Chưa chọn':letters[selected]+'. '+q.options[selected])+'<br>Đáp án đúng: '+esc(letters[q.answer]+'. '+q.options[q.answer])+'<br>Giải thích: '+esc(q.explanation);ex.classList.add("show")});const pct=Math.round(correct/quizData.length*100);const r=document.getElementById("result");r.innerHTML='<b>'+correct+'/'+quizData.length+' câu đúng · '+pct+'%</b><br>Đáp án và giải thích đã hiện dưới từng câu.';r.classList.add("show");r.scrollIntoView({behavior:"smooth",block:"center"})}
function resetQuiz(){for(const k of Object.keys(state))delete state[k];document.querySelectorAll("input").forEach(i=>i.checked=false);document.querySelectorAll(".option").forEach(o=>o.classList.remove("correct","wrong"));document.querySelectorAll(".explain").forEach(e=>{e.classList.remove("show");e.innerHTML=""});document.getElementById("result").classList.remove("show");scrollTo({top:0,behavior:"smooth"})}
render();
