nt-size:clamp(4.2rem,10vw,7rem);font-weight:900;color:var(--red);line-height:.96}.vocab .pinyin{font-size:clamp(1.35rem,3.2vw,2rem);margin-top:10px}.meaning{font-size:clamp(1.2rem,2.6vw,1.7rem);font-weight:900;color:var(--burgundy);margin-top:3px}.meta{color:var(--muted);font-size:.95rem}.usage{font-size:1.02rem;margin-top:10px;color:#403833}.examples{margin-top:18px;border-top:1px solid var(--line);padding-top:12px;display:grid;gap:12px}.ex{margin:0}.ex-cn{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:clamp(1.35rem,3vw,1.75rem);font-weight:900}.vocab-side{display:grid;gap:14px}.vocab-image{margin:0;min-height:210px;border:1.5px dashed #d8b07a;border-radius:10px;background:#fffaf1;display:grid;grid-template-rows:1fr auto;overflow:hidden}.vocab-image img{width:100%;height:100%;min-height:210px;object-fit:cover;display:block}.vocab-image figcaption{padding:8px 10px;background:white;color:var(--muted);font-size:.88rem;border-top:1px solid var(--line)}.vocab-image.panda-default{border-style:solid;background:#fffaf1}.vocab-image.panda-default img{object-fit:cover;object-position:center}.stroke-area{background:var(--light);border:1px solid var(--line);border-radius:10px;padding:12px}.stroke-title{font-family:"Noto Serif SC","Microsoft YaHei",serif;font-size:1.22rem;color:var(--burgundy);font-weight:900}.stroke-title span{font-family:inherit;color:var(--muted);font-size:1rem}.stroke-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px;margin-top:10px}.stroke-card{background:white;border:1px solid var(--line);border-radius:9px;min-height:122px;display:grid;grid-template-rows:1fr auto;align-items:center;justify-items:center;padding:8px}.stroke-card img{max-width:100%;height:82px;object-fit:contain}.stroke-card span{font-family:"Noto Serif SC","Microsoft YaHei",serif;color:var(--burgundy);font-weight:900}.stroke-card.missing{border-style:dashed;background:#fffaf1;align-items:stretch}.radical-note{width:100%;display:grid;gap:5px}.radical-char{font-family:"Noto Serif SC","Microsoft YaHei",serif;font-size:2.3rem;line-height:1;color:var(--red);font-weight:900;text-align:center}.radical-line{display:grid;grid-template-columns:32px 1fr;gap:6px;align-items:start;font-size:.78rem;color:#5f5147;line-height:1.25}.radical-line b{font-family:"Noto Serif SC","Microsoft YaHei",serif;color:var(--burgundy);font-size:1.05rem}.stroke-note{color:var(--muted)}.grammar-title{font-family:"Noto Serif SC","Microsoft YaHei",serif;color:var(--burgundy);font-size:1.85rem;font-weight:900}.grammar-subtitle{font-size:1.05rem;color:var(--muted);font-weight:800;margin-top:4px}.grammar-detail{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}.grammar-block{background:var(--ivory);border:1px solid var(--line);border-radius:9px;padding:12px}.grammar-block b{color:var(--burgundy)}.grammar-block p{margin:.35rem 0 0}.grammar-block.warning{background:#fff4f2}.grammar-block.remember{background:#fffaf1}.formula{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.formula span{background:var(--light);border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--burgundy);font-weight:900}.formula span.hot{background:#fff1ef;border-color:#e8aaa5;color:var(--red)}.grammar-examples{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}.dialogue .turn{display:grid;grid-template-columns:44px 1fr;gap:12px;border-top:1px solid var(--line);padding:12px 0}.speaker{width:38px;height:38px;border-radius:50%;background:var(--burgundy);color:white;display:grid;place-items:center;font-weight:900}.turn-cn{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:1.28rem;font-weight:900}.practice-tools{position:sticky;top:54px;z-index:4;display:flex;gap:10px;justify-content:flex-end;margin:12px 0}.practice-tools button{border:1px solid var(--line);border-radius:999px;background:white;color:var(--burgundy);font-weight:900;padding:9px 13px;box-shadow:0 8px 18px rgba(82,45,29,.08)}.exercise-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.teacher-badge{background:var(--light);border:1px solid var(--line);color:var(--burgundy);border-radius:999px;padding:6px 10px;font-size:.84rem;font-weight:900;white-space:nowrap}.exercise-stage{display:flex;align-items:center;gap:8px;margin-top:14px;color:var(--burgundy)}.exercise-stage span{width:25px;height:25px;border-radius:50%;background:var(--burgundy);color:white;display:grid;place-items:center;font-weight:900}.exercise-stage.answer-stage{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}.exercise-title{font-family:"Noto Serif SC","Microsoft YaHei",serif;color:var(--burgundy);font-size:1.35rem;font-weight:900}.exercise-instruction{font-weight:800;margin-top:6px}.exercise-q{font-weight:900;font-size:1.16rem;white-space:pre-line;background:var(--ivory);border:1px solid var(--line);border-radius:9px;padding:12px;margin-top:12px}.exercise-q.situation{font-weight:700;color:#403833}.keyword-bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.keyword-bank span{background:#fffaf1;border:1px solid var(--line);border-radius:999px;padding:6px 10px;color:var(--burgundy);font-weight:900}.write-lines{display:grid;gap:12px;margin-top:14px}.write-lines span{display:block;height:42px;border-bottom:2px solid var(--line)}.answer-panel{margin-top:10px;border:1px solid var(--line);border-radius:9px;background:#fffaf1;padding:10px}.answer-panel summary{cursor:pointer;color:var(--burgundy);font-weight:900}.answer-main{font-size:1.05rem;margin-top:8px;color:#0f5528}.answer-cn{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:1.18rem;font-weight:900;margin-top:8px}.answer-explain{margin-top:8px;border-top:1px solid var(--line);padding-top:8px;color:#403833}.options{display:grid;gap:8px;margin-top:10px}.option{display:grid;grid-template-columns:32px 1fr;gap:8px;align-items:start;width:100%;border:1px solid var(--line);background:var(--light);border-radius:8px;padding:10px 12px;text-align:left;font-size:1rem}.option.teacher-answer.show-answer{background:var(--okbg);border-color:var(--ok);color:#0f5528;font-weight:900}.option.correct{background:var(--okbg);border-color:var(--ok);color:#0f5528;font-weight:900}.option.wrong{background:var(--badbg);border-color:var(--bad);color:#8f1919}.explain{display:none;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}.explain.show{display:block}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.btn{border:0;border-radius:8px;background:var(--red);color:white;padding:12px 16px;font-weight:900}.btn.secondary{background:var(--beige);color:var(--burgundy)}.result{display:none;background:var(--burgundy);color:white;border-radius:10px;padding:16px;margin:18px 0}.result.show{display:block}.index-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.lesson-link{display:block;text-decoration:none;color:var(--text);background:white;border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:0 10px 28px rgba(82,45,29,.08)}.lesson-link b{color:var(--burgundy);font-size:1.1rem}.review-link{border-color:#d8b07a;background:#fffaf1}@media(max-width:860px){.vocab-body{grid-template-columns:1fr}.vocab-side{order:-1}.vocab .hanzi{font-size:clamp(4rem,18vw,6rem)}.vocab-image{min-height:180px}.vocab-image img{min-height:180px}.grammar-detail,.grammar-examples{grid-template-columns:1fr}}@media(max-width:760px){.index-grid{grid-template-columns:1fr}.dialogue .turn{grid-template-columns:36px 1fr}.hero{padding:26px 0}.section-title{display:block}.topnav a{font-size:.86rem}.card{padding:14px}.vocab{padding:0}.vocab-body{padding:14px}.turn-cn{font-size:1.16rem}.stroke-grid{grid-template-columns:repeat(auto-fit,minmax(128px,1fr))}.practice-tools{top:48px;justify-content:stretch}.practice-tools button{flex:1}.exercise-top{display:block}.teacher-badge{display:inline-block;margin-top:8px}}

<script>
const quizData=[{"section":"Pinyin","type":"pinyin","prompt":"Pinyin đúng của “破” là gì?","options":["kǎlā OK","pò","lúntāi","wǎn'ān"],"answer":1,"explanation":"Pinyin của “破” là pò.","source":"Bài 23"},{"section":"Từ vựng","type":"meaning","prompt":"“空气” nghĩa là gì?","options":["đánh, chơi","không khí","khám bệnh","cổng, lối vào"],"answer":1,"explanation":"“空气” đọc là kōngqì, nghĩa là “không khí”.","source":"Bài 25"},{"section":"Ngữ pháp","type":"grammar","prompt":"Giải thích này thuộc điểm ngữ pháp nào? \"最好\" đặt trước động từ để biểu thị đề xuất, kiến nghị.,Dùng khi đưa ra lời khuyên hoặc ý kiến tốt nhất nên làm.,Thường dịch là \"tốt nhất là...\" hoặc \"nên...\"","options":["最好","“的” 和 “地”","了（3）","得（děi）"],"answer":0,"explanation":"Điểm ngữ pháp là “最好”.","source":"Bài 22"},{"section":"Từ vựng","type":"meaning","prompt":"“日” nghĩa là gì?","options":["viết","ngày","rót, đổ","chúc ngủ ngon"],"answer":1,"explanation":"“日” đọc là rì, nghĩa là “ngày”.","source":"Bài 22"},{"section":"Pinyin","type":"pinyin","prompt":"Pinyin đúng của “太极拳” là gì?","options":["kàn","bīngjīlíng","tàijíquán","xiǎoshí"],"answer":2,"explanation":"Pinyin của “太极拳” là tàijíquán.","source":"Bài 25"},{"section":"Ngữ pháp","type":"grammar","prompt":"Giải thích này thuộc điểm ngữ pháp nào? Thứ tự biểu đạt ngày tháng trong tiếng Hán là: năm + tháng + ngày.,Trong khẩu ngữ, thường dùng \"号\", không dùng \"日\".,Ví dụ: 2012年11月15日 (văn viết) = 2012年11月15号 (khẩu ngữ)","options":["能","日期表达法","好像","最好"],"answer":1,"explanation":"Điểm ngữ pháp là “日期表达法”.","source":"Bài 22"},{"section":"Từ vựng","type":"meaning","prompt":"“着急” nghĩa là gì?","options":["nghỉ ngơi","xin nghỉ","thế thì","lo lắng, sốt ruột"],"answer":3,"explanation":"“着急” đọc là zháojí, nghĩa là “lo lắng, sốt ruột”.","source":"Bài 23"},{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “một số”?","options":["日","有的","小时","忘"],"answer":1,"explanation":"Đáp án đúng là “有的”, đọc là yǒude.","source":"Bài 21"},{"section":"Pinyin","type":"pinyin","prompt":"Pinyin đúng của “放心” là gì?","options":["pǎo","fàng xīn","zhù","tù"],"answer":1,"explanation":"Pinyin của “放心” là fàng xīn.","source":"Bài 24"},{"section":"Từ vựng","type":"meaning","prompt":"“卡拉OK” nghĩa là gì?","options":["thủng, rách, vỡ","ho","cuộc thi","karaoke"],"answer":3,"explanation":"“卡拉OK” đọc là kǎlā OK, nghĩa là “karaoke”.","source":"Bài 24"},{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “nhiệt tình”?","options":["场","热情","头疼","汗"],"answer":1,"explanation":"Đáp án đúng là “热情”, đọc là rèqíng.","source":"Bài 21"},{"section":"Từ vựng","type":"meaning","prompt":"“迟到” nghĩa là gì?","options":["triển lãm","học sinh nữ","chảy ra, xuất ra","đến muộn"],"answer":3,"explanation":"“迟到” đọc là chídào, nghĩa là “đến muộn”.","source":"Bài 23"},{"section":"Từ vựng","type":"meaning","prompt":"“初中” nghĩa là gì?","options":["cái ô","bữa sáng","lên mạng","cấp 2"],"answer":3,"explanation":"“初中” đọc là chūzhōng, nghĩa là “cấp 2”.","source":"Bài 23"},{"section":"Ngữ pháp","type":"grammar","prompt":"Giải thích này thuộc điểm ngữ pháp nào? Hành động trước hoàn thành rồi mới đến hành động tiếp theo.","options":["日期表达法","了（3）","了（4）","助动词小结"],"answer":2,"explanation":"Điểm ngữ pháp là “了（4）”.","source":"Bài 24"},{"section":"Từ vựng","type":"meaning","prompt":"“看病” nghĩa là gì?","options":["karaoke","tiêm","khám bệnh","muộn, tối"],"answer":2,"explanation":"“看病” đọc là kàn bìng, nghĩa là “khám bệnh”.","source":"Bài 22"},{"section":"Bài khóa","type":"textbook","prompt":"Câu “是吗？那我也去吧。” nghĩa là gì? Shì ma? Nà wǒ yě qù ba.","options":["Vậy à? Thế tôi cũng đi nhé.","Bạn tham gia lớp Thái cực quyền rồi à?","Chắc lên mạng nói chuyện với bạn học. Mai gặp!","Chưa. Mai tôi sẽ tham gia một buổi tụ họp."],"answer":0,"explanation":"“是吗？那我也去吧。” nghĩa là “Vậy à? Thế tôi cũng đi nhé.”.","source":"Bài 24"},{"section":"Từ vựng","type":"meaning","prompt":"“地” nghĩa là gì?","options":["rượu trắng","bóng đá","trợ từ","chúc"],"answer":2,"explanation":"“地” đọc là de, nghĩa là “trợ từ”.","source":"Bài 21"},{"section":"Bài khóa","type":"textbook","prompt":"Câu “还没呢。明天我要参加一个聚会。” nghĩa là gì? Hái méi ne. Míngtiān wǒ yào cānjiā yí gè jùhuì.","options":["Sau này tôi sẽ chạy bộ và đi dạo nhiều hơn.","Chưa. Mai tôi sẽ tham gia một buổi tụ họp.","Bạn tham gia lớp Thái cực quyền rồi à?","Hôm kia anh ấy đi xem một trận bóng đá, lúc về thì trời mưa, anh ấy không mang ô nên bị cảm."],"answer":1,"explanation":"“还没呢。明天我要参加一个聚会。” nghĩa là “Chưa. Mai tôi sẽ tham gia một buổi tụ họp.”.","source":"Bài 24"},{"section":"Bài khóa","type":"textbook","prompt":"Câu “你怎么喝那么多酒呢？” nghĩa là gì? Nǐ zěnme hē nàme duō jiǔ ne?","options":["Tập luyện nhiều rất tốt cho sức khỏe.","Bạn ngủ sớm thế à? Không xem TV nữa sao?","Sao bạn uống nhiều rượu thế?","Không. Xe đạp của tôi hỏng, thay lốp mất khá lâu."],"answer":2,"explanation":"“你怎么喝那么多酒呢？” nghĩa là “Sao bạn uống nhiều rượu thế?”.","source":"Bài 21"},{"section":"Điền từ","type":"fill","prompt":"请______我的请假条。 Qǐng pīzhǔn wǒ de qǐngjiàtiáo. Xin phê duyệt giấy xin nghỉ của tôi.","options":["初中","批准","感冒","坏"],"answer":1,"explanation":"Câu đầy đủ là “请批准我的请假条。”.","source":"Bài 22"},{"section":"Điền từ","type":"fill","prompt":"请______这个句子。 Qǐng fānyì zhè ge jùzi. Xin dịch câu này.","options":["翻译","忘","场","下"],"answer":0,"explanation":"Câu đầy đủ là “请翻译这个句子。”.","source":"Bài 23"},{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “bữa sáng”?","options":["早饭","语法","继续","饭"],"answer":0,"explanation":"Đáp án đúng là “早饭”, đọc là zǎofàn.","source":"Bài 24"},{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “hình như”?","options":["着急","好像","坏","湖"],"answer":1,"explanation":"Đáp án đúng là “好像”, đọc là hǎoxiàng.","source":"Bài 21"},{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “thế này”?","options":["这么","空气","破","批准"],"answer":0,"explanation":"Đáp án đúng là “这么”, đọc là zhème.","source":"Bài 25"},{"section":"Điền từ","type":"fill","prompt":"这是______。 Zhè shì xià. Đây là sau, tiếp.","options":["下","疯","班","没意见"],"answer":0,"explanation":"Câu đầy đủ là “这是下。”.","source":"Bài 23"},{"section":"Bài khóa","type":"textbook","prompt":"Câu “没关系。路上堵车了吗？” nghĩa là gì? Méiguānxi. Lùshang dǔchē le ma?","options":["Vậy à? Thế tôi cũng đi nhé.","Không sao. Trên đường bị tắc xe à?","Sao bạn uống nhiều rượu thế?","Hôm qua tôi đến nhà một người bạn Trung Quốc ăn cơm, họ quá nhiệt tình, cứ rót rượu cho tôi."],"answer":1,"explanation":"“没关系。路上堵车了吗？” nghĩa là “Không sao. Trên đường bị tắc xe à?”.","source":"Bài 23"},{"section":"Pinyin","type":"pinyin","prompt":"Pinyin đúng của “场” là gì?","options":["shēngqì","chǎng","chūzhōng","de"],"answer":1,"explanation":"Pinyin của “场” là chǎng.","source":"Bài 22"},{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “xem, thấy”?","options":["有的","看","早饭","好像"],"answer":1,"explanation":"Đáp án đúng là “看”, đọc là kàn.","source":"Bài 23"},{"section":"Từ vựng","type":"meaning","prompt":"“门口” nghĩa là gì?","options":["cổng, lối vào","sắc mặt","muộn, tối","mồ hôi"],"answer":0,"explanation":"“门口” đọc là ménkǒu, nghĩa là “cổng, lối vào”.","source":"Bài 24"},{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “tiếng đồng hồ”?","options":["打针","足球","钟头","场"],"answer":2,"explanation":"Đáp án đúng là “钟头”, đọc là zhōngtóu.","source":"Bài 23"},{"section":"Ngữ pháp","type":"grammar","prompt":"Giải thích này thuộc điểm ngữ pháp nào? Dùng khi một việc đã xảy ra trước đó và nay xảy ra lần nữa.","options":["又","日期表达法","了（4）","了（3）"],"answer":0,"explanation":"Điểm ngữ pháp là “又”.","source":"Bài 21"},{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “tốt nhất là”?","options":["放心","醉","最好","开"],"answer":2,"explanation":"Đáp án đúng là “最好”, đọc là zuìhǎo.","source":"Bài 22"},{"section":"Bài khóa","type":"textbook","prompt":"Câu “请假条” nghĩa là gì? Qǐngjiàtiáo","options":["Thưa thầy/cô, hôm nay Đại Vệ lại không thể đến lớp rồi.","Vâng, anh ấy bị cảm rồi. Đau đầu, sốt, lại còn ho một chút.","Giấy xin nghỉ","Chưa. Mai tôi sẽ tham gia một buổi tụ họp."],"answer":2,"explanation":"“请假条” nghĩa là “Giấy xin nghỉ”.","source":"Bài 22"},{"section":"Ngữ pháp","type":"grammar","prompt":"Giải thích này thuộc điểm ngữ pháp nào? Dùng hình thức câu hỏi để khẳng định thái độ hoặc ý kiến.","options":["了（4）","反问句（2）","得（děi）","了（3）"],"answer":1,"explanation":"Điểm ngữ pháp là “反问句（2）”.","source":"Bài 24"},{"section":"Điền từ","type":"fill","prompt":"______边的空气很好。 Hú biān de kōngqì hěn hǎo. Không khí bên hồ rất tốt.","options":["湖","这么","口语","日"],"answer":0,"explanation":"Câu đầy đủ là “湖边的空气很好。”.","source":"Bài 25"},{"section":"Từ vựng","type":"meaning","prompt":"“早饭” nghĩa là gì?","options":["thức đêm, thức khuya","Thái cực quyền","học kì","bữa sáng"],"answer":3,"explanation":"“早饭” đọc là zǎofàn, nghĩa là “bữa sáng”.","source":"Bài 24"},{"section":"Pinyin","type":"pinyin","prompt":"Pinyin đúng của “语法” là gì?","options":["yǔfǎ","pīzhǔn","qiú","zhōngtóu"],"answer":0,"explanation":"Pinyin của “语法” là yǔfǎ.","source":"Bài 23"},{"section":"Pinyin","type":"pinyin","prompt":"Pinyin đúng của “倒霉” là gì?","options":["fàng xīn","fānyì","dǎoméi","chǎng"],"answer":2,"explanation":"Pinyin của “倒霉” là dǎoméi.","source":"Bài 23"},{"section":"Điền từ","type":"fill","prompt":"我不喝______。 Wǒ bù hē báijiǔ. Tôi không uống rượu trắng.","options":["白酒","散步","聊天儿","女生"],"answer":0,"explanation":"Câu đầy đủ là “我不喝白酒。”.","source":"Bài 21"},{"section":"Ngữ pháp","type":"grammar","prompt":"Giải thích này thuộc điểm ngữ pháp nào? Dùng để yêu cầu, đề nghị hoặc khuyên người khác làm hoặc không làm gì.","options":["了（4）","祈使句","得（děi）","反问句（2）"],"answer":1,"explanation":"Điểm ngữ pháp là “祈使句”.","source":"Bài 24"},{"section":"Pinyin","type":"pinyin","prompt":"Pinyin đúng của “翻译” là gì?","options":["tóuténg","kǎlā OK","fānyì","sàn bù"],"answer":2,"explanation":"Pinyin của “翻译” là fānyì.","source":"Bài 23"},{"section":"Từ vựng","type":"meaning","prompt":"“打” nghĩa là gì?","options":["cái ô","đánh, chơi","cổng, lối vào","bực, tức giận"],"answer":1,"explanation":"“打” đọc là dǎ, nghĩa là “đánh, chơi”.","source":"Bài 24"},{"section":"Điền từ","type":"fill","prompt":"我等了一个______。 Wǒ děng le yí ge zhōngtóu. Tôi đã đợi một tiếng đồng hồ.","options":["钟头","美术馆","病","最好"],"answer":0,"explanation":"Câu đầy đủ là “我等了一个钟头。”.","source":"Bài 23"},{"section":"Ngữ pháp","type":"grammar","prompt":"Giải thích này thuộc điểm ngữ pháp nào? Dùng khi người nói nhấn mạnh sự cần thiết.","options":["最好","助动词小结","得（děi）","了（4）"],"answer":2,"explanation":"Điểm ngữ pháp là “得（děi）”.","source":"Bài 25"},{"section":"Bài khóa","type":"textbook","prompt":"Câu “昨天我去一个中国朋友家吃饭，他们太热情了，一直不停地给我倒酒。” nghĩa là gì? Zuótiān wǒ qù yí gè Zhōngguó péngyou jiā chīfàn, tāmen tài rèqíng le, yìzhí bù tíng de gěi wǒ dào jiǔ.","options":["Hôm qua tôi đến nhà một người bạn Trung Quốc ăn cơm, họ quá nhiệt tình, cứ rót rượu cho tôi.","Tập luyện nhiều rất tốt cho sức khỏe.","Sao lại bị cảm vậy?","Chúc ngủ ngon, Trung Thôn."],"answer":0,"explanation":"“昨天我去一个中国朋友家吃饭，他们太热情了，一直不停地给我倒酒。” nghĩa là “Hôm qua tôi đến nhà một người bạn Trung Quốc ăn cơm, họ quá nhiệt tình, cứ rót rượu cho tôi.”.","source":"Bài 21"},{"section":"Điền từ","type":"fill","prompt":"我喜欢______球。 Wǒ xǐhuan dǎ qiú. Tôi thích chơi bóng.","options":["脸色","请假条","打","学期"],"answer":2,"explanation":"Câu đầy đủ là “我喜欢打球。”.","source":"Bài 24"},{"section":"Ngữ pháp","type":"grammar","prompt":"Giải thích này thuộc điểm ngữ pháp nào? “的” đứng trước danh từ; “地” đứng trước động từ hoặc cụm động từ.","options":["最好","祈使句","“的” 和 “地”","反问句（2）"],"answer":2,"explanation":"Điểm ngữ pháp là ““的” 和 “地””.","source":"Bài 23"},{"section":"Điền từ","type":"fill","prompt":"请______写一遍。 Qǐng chóngxīn xiě yí biàn. Xin viết lại một lần.","options":["头疼","白酒","重新","见面"],"answer":2,"explanation":"Câu đầy đủ là “请重新写一遍。”.","source":"Bài 25"},{"section":"Từ vựng","type":"meaning","prompt":"“闹钟” nghĩa là gì?","options":["một số","đồng hồ báo thức","tìm, kiếm","sốt"],"answer":1,"explanation":"“闹钟” đọc là nàozhōng, nghĩa là “đồng hồ báo thức”.","source":"Bài 25"},{"section":"Pinyin","type":"pinyin","prompt":"Pinyin đúng của “没意见” là gì?","options":["yǒude","dǎ","méi yìjiàn","báijiǔ"],"answer":2,"explanation":"Pinyin của “没意见” là méi yìjiàn.","source":"Bài 24"}];const letters=["A","B","C","D"];const state={};
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
function render(){const root=document.getElementById("quiz");let section="";root.innerHTML="";quizData.forEach((q,i)=>{if(q.section!==section){section=q.section;root.insertAdjacentHTML("beforeend",'<div class="section-title"><h2>'+esc(section)+'</h2><span></span></div>')}const opts=q.options.map((o,j)=>'<label class="option" id="q-'+i+'-o-'+j+'"><input type="radio" name="q-'+i+'" onchange="state['+i+']='+j+'"> <span><b>'+letters[j]+'.</b> '+esc(o)+'</span></label>').join("");root.insertAdjacentHTML("beforeend",'<article class="card" id="q-'+i+'"><div class="meta">Câu '+(i+1)+' · '+esc(q.type)+' · '+esc(q.source)+'</div><div class="exercise-q">'+esc(q.prompt)+'</div><div class="options">'+opts+'</div><div class="explain" id="q-'+i+'-ex"></div></article>')})}
function submitQuiz(){let correct=0;quizData.forEach((q,i)=>{const selected=state[i];q.options.forEach((_,j)=>{const el=document.getElementById("q-"+i+"-o-"+j);el.classList.remove("correct","wrong");if(j===q.answer)el.classList.add("correct");if(selected===j&&selected!==q.answer)el.classList.add("wrong")});if(selected===q.answer)correct++;const ex=document.getElementById("q-"+i+"-ex");ex.innerHTML='<b>'+(selected===q.answer?'Đúng':'Chưa đúng')+'.</b><br>Bạn chọn: '+esc(selected===undefined?'Chưa chọn':letters[selected]+'. '+q.options[selected])+'<br>Đáp án đúng: '+esc(letters[q.answer]+'. '+q.options[q.answer])+'<br>Giải thích: '+esc(q.explanation);ex.classList.add("show")});const pct=Math.round(correct/quizData.length*100);const r=document.getElementById("result");r.innerHTML='<b>'+correct+'/'+quizData.length+' câu đúng · '+pct+'%</b><br>Đáp án và giải thích đã hiện dưới từng câu.';r.classList.add("show");r.scrollIntoView({behavior:"smooth",block:"center"})}
function resetQuiz(){for(const k of Object.keys(state))delete state[k];document.querySelectorAll("input").forEach(i=>i.checked=false);document.querySelectorAll(".option").forEach(o=>o.classList.remove("correct","wrong"));document.querySelectorAll(".explain").forEach(e=>{e.classList.remove("show");e.innerHTML=""});document.getElementById("result").classList.remove("show");scrollTo({top:0,behavior:"smooth"})}
render();
</script>
