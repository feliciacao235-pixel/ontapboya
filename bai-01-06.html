<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ÔN TẬP BOYA BÀI 01-06</title>
  <style>
    :root {
      --burgundy: #781f2b;
      --red: #c93632;
      --beige: #f2e7d8;
      --light-beige: #f8f1e7;
      --ivory: #fcfaf6;
      --white: #ffffff;
      --text: #252525;
      --muted: #68625c;
      --warm: #403b37;
      --gold: #b78a4a;
      --line: #e7d8c7;
      --correct: #16803c;
      --correct-bg: #e5f7ea;
      --wrong: #be2323;
      --wrong-bg: #fde8e7;
      --shadow: 0 10px 30px rgba(80, 41, 28, 0.08);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--ivory);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Be Vietnam Pro", Arial, sans-serif;
      line-height: 1.55;
      padding-bottom: 110px;
    }
    .hero {
      background: var(--burgundy);
      color: var(--white);
      padding: 30px 18px 28px;
      border-bottom: 8px solid var(--beige);
    }
    .hero-inner, main, .bar-inner {
      width: min(920px, calc(100vw - 28px));
      margin: 0 auto;
    }
    .eyebrow {
      color: #f4dfc7;
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 0;
      margin-bottom: 10px;
    }
    h1 {
      margin: 0;
      font-family: Georgia, "Noto Serif SC", "Times New Roman", serif;
      font-size: clamp(1.75rem, 6vw, 3.2rem);
      line-height: 1.12;
    }
    .subtitle {
      margin: 12px 0 0;
      color: #f3e4d3;
      font-size: 1rem;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin: 18px 0 8px;
    }
    .summary div {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 8px;
      padding: 10px;
    }
    .summary strong {
      display: block;
      font-size: 1.15rem;
      color: #fff4df;
    }
    main { padding: 22px 0; }
    .section-title {
      margin: 28px 0 12px;
      padding: 12px 16px;
      background: var(--burgundy);
      color: var(--white);
      border-radius: 8px;
      font-weight: 800;
      font-size: 1.05rem;
    }
    .question-card {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 10px;
      margin: 0 0 14px;
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .question-card.correct-card { border-color: rgba(22,128,60,0.45); }
    .question-card.wrong-card { border-color: rgba(190,35,35,0.45); }
    .q-meta {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--red);
      font-size: 0.86rem;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .prompt {
      white-space: pre-line;
      font-size: 1.06rem;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .options {
      display: grid;
      gap: 8px;
    }
    .option {
      display: grid;
      grid-template-columns: 34px 1fr;
      align-items: start;
      gap: 8px;
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--light-beige);
      cursor: pointer;
      text-align: left;
      color: var(--text);
      font-size: 1rem;
    }
    .option input { margin-top: 4px; }
    .option.correct {
      background: var(--correct-bg);
      border-color: var(--correct);
      color: #0f5528;
      font-weight: 800;
    }
    .option.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong);
      color: #8f1919;
    }
    .explanation {
      display: none;
      margin-top: 12px;
      border-top: 1px solid var(--line);
      padding-top: 11px;
      color: var(--warm);
      font-size: 0.98rem;
    }
    .explanation.show { display: block; }
    .explanation strong { color: var(--burgundy); }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 26px 0;
    }
    button.primary, button.secondary {
      border: 0;
      border-radius: 8px;
      padding: 13px 18px;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
    }
    button.primary { background: var(--red); color: var(--white); }
    button.secondary { background: var(--beige); color: var(--burgundy); }
    .result {
      display: none;
      background: var(--burgundy);
      color: var(--white);
      border-radius: 10px;
      padding: 18px;
      margin: 20px 0 28px;
      box-shadow: var(--shadow);
    }
    .result.show { display: block; }
    .result strong { font-size: 1.5rem; color: #fff4df; }
    .sticky {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(252,250,246,0.96);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--line);
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
      z-index: 20;
    }
    .bar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .progress {
      font-weight: 800;
      color: var(--burgundy);
      font-size: 0.94rem;
    }
    .mini-submit {
      border: 0;
      border-radius: 8px;
      background: var(--red);
      color: var(--white);
      padding: 10px 14px;
      font-weight: 800;
    }
    @media (max-width: 720px) {
      body { padding-bottom: 126px; }
      .summary { grid-template-columns: repeat(2, 1fr); }
      .q-meta { flex-direction: column; }
      .option { grid-template-columns: 28px 1fr; }
      .bar-inner { align-items: stretch; flex-direction: column; }
      .mini-submit { width: 100%; }
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div class="eyebrow">Boya Chinese · Ôn tập theo cụm 6 bài</div>
      <h1>ÔN TẬP BOYA BÀI 01-06</h1>
      <p class="subtitle">Làm xong bấm nộp bài để xem điểm, đáp án đúng/sai và giải thích từng câu.</p>
      <div class="summary">
        <div><strong>1, 2, 3, 4, 5, 6</strong>Bài học</div>
        <div><strong>120</strong>Từ mới</div>
        <div><strong>24</strong>Điểm ngữ pháp</div>
        <div><strong>50</strong>Câu ôn tập</div>
      </div>
    </div>
  </header>

  <main>
    <div id="quiz"></div>
    <div class="actions">
      <button class="primary" type="button" onclick="submitQuiz()">Nộp bài và xem điểm</button>
      <button class="secondary" type="button" onclick="resetQuiz()">Làm lại</button>
    </div>
    <div id="result" class="result"></div>
  </main>

  <div class="sticky">
    <div class="bar-inner">
      <div class="progress">Đã làm: <span id="answered">0</span>/<span id="total">0</span> câu</div>
      <button class="mini-submit" type="button" onclick="submitQuiz()">Nộp bài</button>
    </div>
  </div>

  <script>
    const quizData = [{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “Lưu (họ người Trung Quốc)”?","options":["音乐","刻","分","刘"],"answer":3,"explanation":"Đáp án đúng là “刘”, đọc là Liú.","source":"Bài 2"},{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “cũng (biểu thị đồng nhất)”?","options":["太……了","也","玩儿","一下儿"],"answer":1,"explanation":"Đáp án đúng là “也”, đọc là yě.","source":"Bài 2"},{"section":"Ngữ pháp","type":"grammar-title","prompt":"Giải thích này thuộc điểm ngữ pháp nào? Điểm ôn tập trong bảng tổng kết ngữ pháp trọng điểm của Bài 5.","options":["在 / 是","呢（1）","后缀“们”","副词“也”"],"answer":0,"explanation":"Điểm ngữ pháp là “在 / 是”. Điểm ôn tập trong bảng tổng kết ngữ pháp trọng điểm của Bài 5.","source":"Bài 5"},{"section":"Bài khóa","type":"text-meaning","prompt":"Câu “清华大学在哪儿？” nghĩa là gì? Qīnghuá Dàxué zài nǎr?","options":["Đại học Thanh Hoa ở đâu?","Chào bạn!","Cảm ơn.","Xin lỗi, tôi không phải sinh viên của trường này, tôi không biết."],"answer":0,"explanation":"“清华大学在哪儿？” nghĩa là “Đại học Thanh Hoa ở đâu?”.","source":"Bài 5"},{"section":"Từ vựng","type":"meaning","prompt":"“知道” nghĩa là gì?","options":["lượng từ cái/chiếc","biết","trường đại học","này, đây"],"answer":1,"explanation":"“知道” đọc là zhīdào, nghĩa là “biết”.","source":"Bài 4"},{"section":"Nghe hiểu bài khóa","type":"speaker","prompt":"Trong bài khóa, ai nói câu này? 请问，卫生间在哪儿？","options":["大卫","玛丽","学生B","张红"],"answer":0,"explanation":"Người nói câu này là 大卫.","source":"Bài 5"},{"section":"Bài khóa","type":"text-meaning","prompt":"Câu “认识你很高兴。” nghĩa là gì? Rènshi nǐ hěn gāoxìng.","options":["Rất vui được quen biết bạn.","Không phải, là tạp chí Trung Quốc.","Không cần cảm ơn.","Cảm ơn."],"answer":0,"explanation":"“认识你很高兴。” nghĩa là “Rất vui được quen biết bạn.”.","source":"Bài 2"},{"section":"Pinyin","type":"pinyin","prompt":"Pinyin đúng của “时候” là gì?","options":["péngyou","lóu","shíhou","shéi / shuí"],"answer":2,"explanation":"Pinyin của “时候” là shíhou.","source":"Bài 5"},{"section":"Điền từ","type":"fill","prompt":"我______好。 Wǒ hěn hǎo. Tôi rất khỏe.","options":["日语","很","卫生间","早上"],"answer":1,"explanation":"Câu đầy đủ là “我很好。”. Cần dùng “很” vì nghĩa là “rất, lắm”.","source":"Bài 2"},{"section":"Ngữ pháp","type":"grammar-title","prompt":"Giải thích này thuộc điểm ngữ pháp nào? Điểm ôn tập trong bảng tổng kết ngữ pháp trọng điểm của Bài 5.","options":["特殊疑问句","副词“也”","在 / 是","用“吗”的疑问句"],"answer":0,"explanation":"Điểm ngữ pháp là “特殊疑问句”. Điểm ôn tập trong bảng tổng kết ngữ pháp trọng điểm của Bài 5.","source":"Bài 5"},{"section":"Cấu trúc","type":"grammar-structure","prompt":"Cấu trúc đúng của “方位名词（1）” là gì?","options":["东 / 西 / 南 / 北 + 边","这 / 那 + 是 + N","呢（1）","Chủ ngữ + 也 + Vị ngữ (Động từ / Tính từ)"],"answer":0,"explanation":"Cấu trúc cần nhớ: 东 / 西 / 南 / 北 + 边.","source":"Bài 4"},{"section":"Ví dụ ngữ pháp","type":"grammar-example","prompt":"Câu sau minh họa điểm ngữ pháp nào? 李军在大卫的右边。 Lǐ Jūn zài Dàwèi de yòubian. Lý Quân ở bên phải David.","options":["哪儿","用“吗”的疑问句","在 / 是","方位名词（1）"],"answer":3,"explanation":"Câu này dùng điểm ngữ pháp “方位名词（1）”.","source":"Bài 4"},{"section":"Ví dụ ngữ pháp","type":"grammar-example","prompt":"Câu sau minh họa điểm ngữ pháp nào? 李军是中国人，刘明也是中国人。 Lǐ Jūn shì Zhōngguó rén, Liú Míng yě shì Zhōngguó rén. Lý Quân là người Trung Quốc, Lưu Minh cũng là người Trung Quốc.","options":["副词“也”","后缀“们”","“是”字句","在 / 是"],"answer":0,"explanation":"Câu này dùng điểm ngữ pháp “副词“也””.","source":"Bài 2"},{"section":"Pinyin","type":"pinyin","prompt":"Pinyin đúng của “欢迎” là gì?","options":["huānyíng","wǒ","zài","kè"],"answer":0,"explanation":"Pinyin của “欢迎” là huānyíng.","source":"Bài 5"},{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “buổi tọa đàm”?","options":["大部分","日语","讲座","叫"],"answer":2,"explanation":"Đáp án đúng là “讲座”, đọc là jiǎngzuò.","source":"Bài 6"},{"section":"Cấu trúc","type":"grammar-structure","prompt":"Cấu trúc đúng của “呢（1）” là gì?","options":["Câu trần thuật + 吗？","呢（1）","们","在 / 是"],"answer":1,"explanation":"Cấu trúc cần nhớ: 呢（1）.","source":"Bài 5"},{"section":"Điền từ","type":"fill","prompt":"请说“______”。 Qǐng shuō “Wèishēngjiān”. Hãy nói “nhà vệ sinh”.","options":["词典","也","卫生间","知道"],"answer":2,"explanation":"Câu đầy đủ là “请说“卫生间”。”. Cần dùng “卫生间” vì nghĩa là “nhà vệ sinh”.","source":"Bài 5"},{"section":"Luyện tập tổng hợp","type":"application-fill","prompt":"完成句子 这是我 ______ 朋友。","options":["的","左边","个","介绍"],"answer":0,"explanation":"Cần điền “的” để câu đúng nghĩa và đúng cấu trúc.","source":"Bài 3"},{"section":"Pinyin","type":"pinyin","prompt":"Pinyin đúng của “早上” là gì?","options":["de","shíhou","zǎoshang","liù"],"answer":2,"explanation":"Pinyin của “早上” là zǎoshang.","source":"Bài 6"},{"section":"Từ vựng","type":"meaning","prompt":"“旁边” nghĩa là gì?","options":["nào, cái nào (đại từ nghi vấn)","gọi là, tên là","hoan nghênh","bên cạnh"],"answer":3,"explanation":"“旁边” đọc là pángbiān, nghĩa là “bên cạnh”.","source":"Bài 5"},{"section":"Luyện tập tổng hợp","type":"application-fill","prompt":"选词填空 · Điền từ thích hợp 你叫 ______ 名字？","options":["姓","王","什么","对不起"],"answer":2,"explanation":"Cần điền “什么” để câu đúng nghĩa và đúng cấu trúc.","source":"Bài 2"},{"section":"Pinyin","type":"pinyin","prompt":"Pinyin đúng của “关系” là gì?","options":["jiù shì","hěn","nǐ","guānxi"],"answer":3,"explanation":"Pinyin của “关系” là guānxi.","source":"Bài 5"},{"section":"Pinyin","type":"pinyin","prompt":"Pinyin đúng của “几” là gì?","options":["cídiǎn","míngzi","yíxiàr","jǐ"],"answer":3,"explanation":"Pinyin của “几” là jǐ.","source":"Bài 6"},{"section":"Từ vựng","type":"meaning","prompt":"“教室” nghĩa là gì?","options":["cảm ơn","David (tên riêng nam)","sách giáo khoa","lớp học"],"answer":3,"explanation":"“教室” đọc là jiàoshì, nghĩa là “lớp học”.","source":"Bài 5"},{"section":"Bài khóa","type":"text-meaning","prompt":"Câu “谢谢。” nghĩa là gì? Xièxie.","options":["Xin hỏi, nhà vệ sinh ở đâu?","Cảm ơn.","Bạn học ơi, đây là thư viện phải không?","Là tòa nhà bên trái phải không?"],"answer":1,"explanation":"“谢谢。” nghĩa là “Cảm ơn.”.","source":"Bài 4"},{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “này, đây”?","options":["也","这","学校","讲座"],"answer":1,"explanation":"Đáp án đúng là “这”, đọc là zhè.","source":"Bài 3"},{"section":"Từ vựng","type":"meaning","prompt":"“那” nghĩa là gì?","options":["số sáu","số tám","kia, đó","dạy học"],"answer":2,"explanation":"“那” đọc là nà, nghĩa là “kia, đó”.","source":"Bài 3"},{"section":"Bài khóa","type":"text-meaning","prompt":"Câu “你好！” nghĩa là gì? Nǐ hǎo!","options":["Đại học Thanh Hoa ở đâu?","Em tên là David ạ.","Chào bạn!","Để mình giới thiệu một chút. Đây là Mary, đây là Lý Quân."],"answer":2,"explanation":"“你好！” nghĩa là “Chào bạn!”.","source":"Bài 1"},{"section":"Ngữ pháp","type":"grammar-title","prompt":"Giải thích này thuộc điểm ngữ pháp nào? Các từ 东、西、南、北 kết hợp với 边 để chỉ phương hướng/vị trí.,Cấu trúc thường dùng khi miêu tả vị trí tương đối của các tòa nhà hoặc địa điểm.","options":["特殊疑问句","方位名词（1）","也","在 / 是"],"answer":1,"explanation":"Điểm ngữ pháp là “方位名词（1）”. Các từ 东、西、南、北 kết hợp với 边 để chỉ phương hướng/vị trí.,Cấu trúc thường dùng khi miêu tả vị trí tương đối của các tòa nhà hoặc địa điểm.","source":"Bài 4"},{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “nhà vệ sinh”?","options":["点","叫","教学","卫生间"],"answer":3,"explanation":"Đáp án đúng là “卫生间”, đọc là wèishēngjiān.","source":"Bài 5"},{"section":"Từ vựng","type":"meaning","prompt":"“李军” nghĩa là gì?","options":["Lý Quân (tên riêng nam)","một lát","biết","chỗ này, nơi này"],"answer":0,"explanation":"“李军” đọc là Lǐ Jūn, nghĩa là “Lý Quân (tên riêng nam)”.","source":"Bài 1"},{"section":"Điền từ","type":"fill","prompt":"我学习“______”。 Wǒ xuéxí “Shí”. Tôi học từ “số mười”.","options":["学校","同屋","好","十"],"answer":3,"explanation":"Câu đầy đủ là “我学习“十”。”. Cần dùng “十” vì nghĩa là “số mười”.","source":"Bài 6"},{"section":"Ví dụ ngữ pháp","type":"grammar-example","prompt":"Câu sau minh họa điểm ngữ pháp nào? 我不是留学生。 Wǒ bú shì liúxuéshēng. Tôi không phải là lưu học sinh.","options":["呢（1）","哪儿","也","“是”字句"],"answer":3,"explanation":"Câu này dùng điểm ngữ pháp ““是”字句”.","source":"Bài 1"},{"section":"Cấu trúc","type":"grammar-structure","prompt":"Cấu trúc đúng của “语气助词“呢”(1)” là gì?","options":["在 / 是","Câu trần thuật + 吗？","Danh từ / Đại từ + 呢？","谁 / 什么 / 哪 + ..."],"answer":2,"explanation":"Cấu trúc cần nhớ: Danh từ / Đại từ + 呢？.","source":"Bài 2"},{"section":"Ví dụ ngữ pháp","type":"grammar-example","prompt":"Câu sau minh họa điểm ngữ pháp nào? 你们不是老师，我们也不是老师。 Nǐmen bú shì lǎoshī, wǒmen yě bú shì lǎoshī. Các bạn không phải giáo viên, chúng tôi cũng không phải giáo viên.","options":["副词“也”","定语","“是”字句","哪儿"],"answer":0,"explanation":"Câu này dùng điểm ngữ pháp “副词“也””.","source":"Bài 2"},{"section":"Từ vựng","type":"meaning","prompt":"“一会儿” nghĩa là gì?","options":["số chín","một lát","kia, đó","giờ"],"answer":1,"explanation":"“一会儿” đọc là yíhuìr, nghĩa là “một lát”.","source":"Bài 6"},{"section":"Luyện tập tổng hợp","type":"application-fill","prompt":"选词填空 这 ______ 汉语课本。","options":["早上","是","现在","左边"],"answer":1,"explanation":"Cần điền “是” để câu đúng nghĩa và đúng cấu trúc.","source":"Bài 3"},{"section":"Luyện tập tổng hợp","type":"application-fill","prompt":"改写句子 · Câu phủ định 她是王老师。 → 她 ______ 王老师。","options":["这儿","不是","加拿大","高兴"],"answer":1,"explanation":"Cần điền “不是” để câu đúng nghĩa và đúng cấu trúc.","source":"Bài 1"},{"section":"Ngữ pháp","type":"grammar-title","prompt":"Giải thích này thuộc điểm ngữ pháp nào? Điểm ôn tập trong bảng tổng kết ngữ pháp trọng điểm của Bài 5.","options":["哪儿","定语","“是”字句","这 / 那"],"answer":1,"explanation":"Điểm ngữ pháp là “定语”. Điểm ôn tập trong bảng tổng kết ngữ pháp trọng điểm của Bài 5.","source":"Bài 5"},{"section":"Luyện tập tổng hợp","type":"application-mc","prompt":"改写句子 · Câu nghi vấn 李军不是老师。 → ?","options":["李军不是老师吗？","李军是老师吗？","李军不是老师。","李军是老师。"],"answer":0,"explanation":"Đáp án đúng là “李军不是老师吗？”.","source":"Bài 1"},{"section":"Ngữ pháp","type":"grammar-title","prompt":"Giải thích này thuộc điểm ngữ pháp nào? “呢” (ne) đặt sau danh từ hoặc đại từ để tạo câu hỏi tỉnh lược khi ngữ cảnh hoặc câu trước đã nêu rõ nội dung hỏi.,Mục đích: Tránh lặp lại câu hỏi dài dòng, tương đương với 'Còn... thì sao?' trong tiếng Việt.,Ví dụ: 我是美国人，你呢？ (= 你是哪国人？ · Tôi là người Mỹ, còn bạn thì sao?).","options":["方位名词（1）","定语","语气助词“呢”(1)","在 / 是"],"answer":2,"explanation":"Điểm ngữ pháp là “语气助词“呢”(1)”. “呢” (ne) đặt sau danh từ hoặc đại từ để tạo câu hỏi tỉnh lược khi ngữ cảnh hoặc câu trước đã nêu rõ nội dung hỏi.,Mục đích: Tránh lặp lại câu hỏi dài dòng, tương đương với 'Còn... thì sao?' trong tiếng Việt.,Ví dụ: 我是美国人，你呢？ (= 你是哪国人？ · Tôi là người Mỹ, còn bạn thì sao?).","source":"Bài 2"},{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “số một”?","options":["北边","我","文学","一"],"answer":3,"explanation":"Đáp án đúng là “一”, đọc là yī.","source":"Bài 6"},{"section":"Từ vựng","type":"meaning","prompt":"“八” nghĩa là gì?","options":["chơi","có","nhé, nhỉ, còn... thì sao? (trợ từ nghi vấn)","số tám"],"answer":3,"explanation":"“八” đọc là bā, nghĩa là “số tám”.","source":"Bài 6"},{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “tòa nhà”?","options":["分","没关系","楼","讲座"],"answer":2,"explanation":"Đáp án đúng là “楼”, đọc là lóu.","source":"Bài 4"},{"section":"Từ vựng","type":"meaning","prompt":"“谁” nghĩa là gì?","options":["bạn cùng phòng","ai, người nào","xin lỗi","không sao"],"answer":1,"explanation":"“谁” đọc là shéi / shuí, nghĩa là “ai, người nào”.","source":"Bài 3"},{"section":"Điền từ","type":"fill","prompt":"请说“______”。 Qǐng shuō “Yíhuìr”. Hãy nói “một lát”.","options":["一会儿","日语","九","名字"],"answer":0,"explanation":"Câu đầy đủ là “请说“一会儿”。”. Cần dùng “一会儿” vì nghĩa là “một lát”.","source":"Bài 6"},{"section":"Cấu trúc","type":"grammar-structure","prompt":"Cấu trúc đúng của “副词“也”” là gì?","options":["东 / 西 / 南 / 北 + 边","Chủ ngữ + 也 + Vị ngữ (Động từ / Tính từ)","Danh từ / Đại từ + 呢？","定语"],"answer":1,"explanation":"Cấu trúc cần nhớ: Chủ ngữ + 也 + Vị ngữ (Động từ / Tính từ).","source":"Bài 2"},{"section":"Luyện tập tổng hợp","type":"application-mc","prompt":"用“也”改写句子 · Câu đồng nhất 李军是中国人，刘明是中国人。 → ?","options":["李军是中国人，刘明也是中国人。","李军也是中国人，刘明是中国人。","李军是中国人，刘明不是中国人。","李军刘明是中国人也。"],"answer":0,"explanation":"Đáp án đúng là “李军是中国人，刘明也是中国人。”.","source":"Bài 2"},{"section":"Nghe hiểu bài khóa","type":"speaker","prompt":"Trong bài khóa, ai nói câu này? 差一刻六点。","options":["大卫","学生B","李军","学生A"],"answer":0,"explanation":"Người nói câu này là 大卫.","source":"Bài 6"},{"section":"Điền từ","type":"fill","prompt":"请说“______”。 Qǐng shuō “Nà”. Hãy nói “kia, đó”.","options":["们","五十","是","那"],"answer":3,"explanation":"Câu đầy đủ là “请说“那”。”. Cần dùng “那” vì nghĩa là “kia, đó”.","source":"Bài 3"}];
    const LETTERS = ["A", "B", "C", "D"];
    const state = {};

    function esc(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function renderQuiz() {
      const root = document.getElementById("quiz");
      document.getElementById("total").textContent = quizData.length;
      let currentSection = "";
      root.innerHTML = "";
      quizData.forEach((item, index) => {
        if (item.section !== currentSection) {
          currentSection = item.section;
          const section = document.createElement("div");
          section.className = "section-title";
          section.textContent = currentSection;
          root.appendChild(section);
        }
        const card = document.createElement("section");
        card.className = "question-card";
        card.id = "q-" + index;
        const options = item.options.map((option, optionIndex) => `
          <label class="option" id="q-${index}-o-${optionIndex}">
            <input type="radio" name="q-${index}" value="${optionIndex}" onchange="choose(${index}, ${optionIndex})">
            <span><strong>${LETTERS[optionIndex]}.</strong> ${esc(option)}</span>
          </label>
        `).join("");
        card.innerHTML = `
          <div class="q-meta"><span>Câu ${index + 1} · ${esc(item.type)}</span><span>${esc(item.source)}</span></div>
          <div class="prompt">${esc(item.prompt)}</div>
          <div class="options">${options}</div>
          <div class="explanation" id="q-${index}-explain"></div>
        `;
        root.appendChild(card);
      });
    }

    function choose(index, optionIndex) {
      state[index] = optionIndex;
      updateProgress();
    }

    function updateProgress() {
      document.getElementById("answered").textContent = Object.keys(state).length;
    }

    function submitQuiz() {
      let correct = 0;
      quizData.forEach((item, index) => {
        const selected = state[index];
        const card = document.getElementById("q-" + index);
        const explain = document.getElementById("q-" + index + "-explain");
        card.classList.remove("correct-card", "wrong-card");
        item.options.forEach((_, optionIndex) => {
          const option = document.getElementById("q-" + index + "-o-" + optionIndex);
          option.classList.remove("correct", "wrong");
          if (optionIndex === item.answer) option.classList.add("correct");
          if (selected === optionIndex && selected !== item.answer) option.classList.add("wrong");
        });
        const isCorrect = selected === item.answer;
        if (isCorrect) correct++;
        card.classList.add(isCorrect ? "correct-card" : "wrong-card");
        const selectedText = selected === undefined ? "Chưa chọn" : LETTERS[selected] + ". " + item.options[selected];
        const correctText = LETTERS[item.answer] + ". " + item.options[item.answer];
        explain.innerHTML = `
          <strong>${isCorrect ? "Đúng" : "Chưa đúng"}.</strong><br>
          Bạn chọn: ${esc(selectedText)}<br>
          Đáp án đúng: ${esc(correctText)}<br>
          Giải thích: ${esc(item.explanation)}
        `;
        explain.classList.add("show");
      });
      const percent = Math.round(correct / quizData.length * 100);
      const result = document.getElementById("result");
      result.innerHTML = `<strong>${correct}/${quizData.length} câu đúng · ${percent}%</strong><br>Phần đáp án và giải thích đã hiện ngay dưới từng câu.`;
      result.classList.add("show");
      result.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    function resetQuiz() {
      for (const key of Object.keys(state)) delete state[key];
      document.querySelectorAll("input[type=radio]").forEach((input) => { input.checked = false; });
      document.querySelectorAll(".option").forEach((el) => el.classList.remove("correct", "wrong"));
      document.querySelectorAll(".question-card").forEach((el) => el.classList.remove("correct-card", "wrong-card"));
      document.querySelectorAll(".explanation").forEach((el) => { el.classList.remove("show"); el.innerHTML = ""; });
      document.getElementById("result").classList.remove("show");
      updateProgress();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    renderQuiz();
  </script>
