<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ÔN TẬP BOYA BÀI 13-18</title>
  <style>
    :root {
      --burgundy: #781f2b;
      --red: #c93632;
      --beige: #f2e7d8;
      --light-beige: #f8f1e7;
      --ivory: #fcfaf6;
      --white: #ffffff;
      --text: #252525;
      --muted: #68625c;
      --warm: #403b37;
      --gold: #b78a4a;
      --line: #e7d8c7;
      --correct: #16803c;
      --correct-bg: #e5f7ea;
      --wrong: #be2323;
      --wrong-bg: #fde8e7;
      --shadow: 0 10px 30px rgba(80, 41, 28, 0.08);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--ivory);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Be Vietnam Pro", Arial, sans-serif;
      line-height: 1.55;
      padding-bottom: 110px;
    }
    .hero {
      background: var(--burgundy);
      color: var(--white);
      padding: 30px 18px 28px;
      border-bottom: 8px solid var(--beige);
    }
    .hero-inner, main, .bar-inner {
      width: min(920px, calc(100vw - 28px));
      margin: 0 auto;
    }
    .eyebrow {
      color: #f4dfc7;
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 0;
      margin-bottom: 10px;
    }
    h1 {
      margin: 0;
      font-family: Georgia, "Noto Serif SC", "Times New Roman", serif;
      font-size: clamp(1.75rem, 6vw, 3.2rem);
      line-height: 1.12;
    }
    .subtitle {
      margin: 12px 0 0;
      color: #f3e4d3;
      font-size: 1rem;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin: 18px 0 8px;
    }
    .summary div {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 8px;
      padding: 10px;
    }
    .summary strong {
      display: block;
      font-size: 1.15rem;
      color: #fff4df;
    }
    main { padding: 22px 0; }
    .section-title {
      margin: 28px 0 12px;
      padding: 12px 16px;
      background: var(--burgundy);
      color: var(--white);
      border-radius: 8px;
      font-weight: 800;
      font-size: 1.05rem;
    }
    .question-card {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 10px;
      margin: 0 0 14px;
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .question-card.correct-card { border-color: rgba(22,128,60,0.45); }
    .question-card.wrong-card { border-color: rgba(190,35,35,0.45); }
    .q-meta {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--red);
      font-size: 0.86rem;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .prompt {
      white-space: pre-line;
      font-size: 1.06rem;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .options {
      display: grid;
      gap: 8px;
    }
    .option {
      display: grid;
      grid-template-columns: 34px 1fr;
      align-items: start;
      gap: 8px;
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--light-beige);
      cursor: pointer;
      text-align: left;
      color: var(--text);
      font-size: 1rem;
    }
    .option input { margin-top: 4px; }
    .option.correct {
      background: var(--correct-bg);
      border-color: var(--correct);
      color: #0f5528;
      font-weight: 800;
    }
    .option.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong);
      color: #8f1919;
    }
    .explanation {
      display: none;
      margin-top: 12px;
      border-top: 1px solid var(--line);
      padding-top: 11px;
      color: var(--warm);
      font-size: 0.98rem;
    }
    .explanation.show { display: block; }
    .explanation strong { color: var(--burgundy); }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 26px 0;
    }
    button.primary, button.secondary {
      border: 0;
      border-radius: 8px;
      padding: 13px 18px;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
    }
    button.primary { background: var(--red); color: var(--white); }
    button.secondary { background: var(--beige); color: var(--burgundy); }
    .result {
      display: none;
      background: var(--burgundy);
      color: var(--white);
      border-radius: 10px;
      padding: 18px;
      margin: 20px 0 28px;
      box-shadow: var(--shadow);
    }
    .result.show { display: block; }
    .result strong { font-size: 1.5rem; color: #fff4df; }
    .sticky {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(252,250,246,0.96);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--line);
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
      z-index: 20;
    }
    .bar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .progress {
      font-weight: 800;
      color: var(--burgundy);
      font-size: 0.94rem;
    }
    .mini-submit {
      border: 0;
      border-radius: 8px;
      background: var(--red);
      color: var(--white);
      padding: 10px 14px;
      font-weight: 800;
    }
    @media (max-width: 720px) {
      body { padding-bottom: 126px; }
      .summary { grid-template-columns: repeat(2, 1fr); }
      .q-meta { flex-direction: column; }
      .option { grid-template-columns: 28px 1fr; }
      .bar-inner { align-items: stretch; flex-direction: column; }
      .mini-submit { width: 100%; }
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div class="eyebrow">Boya Chinese · Ôn tập theo cụm 6 bài</div>
      <h1>ÔN TẬP BOYA BÀI 13-18</h1>
      <p class="subtitle">Làm xong bấm nộp bài để xem điểm, đáp án đúng/sai và giải thích từng câu.</p>
      <div class="summary">
        <div><strong>13, 14, 15, 16, 17, 18</strong>Bài học</div>
        <div><strong>145</strong>Từ mới</div>
        <div><strong>33</strong>Điểm ngữ pháp</div>
        <div><strong>50</strong>Câu ôn tập</div>
      </div>
    </div>
  </header>

  <main>
    <div id="quiz"></div>
    <div class="actions">
      <button class="primary" type="button" onclick="submitQuiz()">Nộp bài và xem điểm</button>
      <button class="secondary" type="button" onclick="resetQuiz()">Làm lại</button>
    </div>
    <div id="result" class="result"></div>
  </main>

  <div class="sticky">
    <div class="bar-inner">
      <div class="progress">Đã làm: <span id="answered">0</span>/<span id="total">0</span> câu</div>
      <button class="mini-submit" type="button" onclick="submitQuiz()">Nộp bài</button>
    </div>
  </div>

  <script>
    const quizData = [{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “trợ từ dùng ở cuối vế câu điều kiện”?","options":["的话","颜色","银行","看起来"],"answer":0,"explanation":"Đáp án đúng là “的话”, đọc là dehuà.","source":"Bài 18"},{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “lười biếng”?","options":["花","空调","偷懒","心意"],"answer":2,"explanation":"Đáp án đúng là “偷懒”, đọc là tōu lǎn.","source":"Bài 18"},{"section":"Bài khóa","type":"text-meaning","prompt":"Câu “北方人喜欢，南方人喜欢米饭。” nghĩa là gì? Běifāng rén xǐhuan, nánfāng rén xǐhuan mǐfàn.","options":["Chúng ta đi lúc mấy giờ?","Trên đường thuận lợi, trên xe hơi đông.","Người miền Bắc thích, người miền Nam thích cơm.","Đúng, tôi mua một chiếc cũ, xe cũ tương đối rẻ, cũng không dễ mất."],"answer":2,"explanation":"“北方人喜欢，南方人喜欢米饭。” nghĩa là “Người miền Bắc thích, người miền Nam thích cơm.”.","source":"Bài 18"},{"section":"Ngữ pháp","type":"grammar-title","prompt":"Giải thích này thuộc điểm ngữ pháp nào? Dùng để hỏi người nghe chọn một trong hai khả năng.","options":["选择问句：是……还是……","挺 + 形容词","有（一）点儿","A 还是 B"],"answer":0,"explanation":"Điểm ngữ pháp là “选择问句：是……还是……”. Dùng để hỏi người nghe chọn một trong hai khả năng.","source":"Bài 15"},{"section":"Bài khóa","type":"text-meaning","prompt":"Câu “你好，李军。你去哪儿？” nghĩa là gì? Nǐ hǎo, Lǐ Jūn. Nǐ qù nǎr?","options":["Khá đẹp. Không phải xe mới nhỉ?","Tất nhiên thích rồi! Cuối tuần có thể nghỉ ngơi thật tốt.","Chào Lý Quân. Bạn đi đâu vậy?","Trên đường thuận lợi, trên xe hơi đông."],"answer":2,"explanation":"“你好，李军。你去哪儿？” nghĩa là “Chào Lý Quân. Bạn đi đâu vậy?”.","source":"Bài 13"},{"section":"Điền từ","type":"fill","prompt":"我学习“______”。 Wǒ xuéxí “Piàoliang”. Tôi học từ “đẹp, xinh đẹp”.","options":["对……来说","特别","漂亮","先"],"answer":2,"explanation":"Câu đầy đủ là “我学习“漂亮”。”. Cần dùng “漂亮” vì nghĩa là “đẹp, xinh đẹp”.","source":"Bài 14"},{"section":"Luyện tập tổng hợp","type":"application-mc","prompt":"选择正确答案 玛丽，___一起去商店吧。（bao gồm cả Mỹ Lệ）","options":["咱们","我们","他们","你们"],"answer":0,"explanation":"Đáp án đúng là “咱们”.","source":"Bài 13"},{"section":"Từ vựng","type":"meaning","prompt":"“茶” nghĩa là gì?","options":["trà","sạch sẽ","gói","phương bắc"],"answer":0,"explanation":"“茶” đọc là chá, nghĩa là “trà”.","source":"Bài 17"},{"section":"Luyện tập tổng hợp","type":"application-fill","prompt":"语音练习 — 朗读 san — shan — sen — shen — xin","options":["新","关门","不错","朗读练习：luyện phát âm"],"answer":3,"explanation":"Cần điền “朗读练习：luyện phát âm” để câu đúng nghĩa và đúng cấu trúc.","source":"Bài 13"},{"section":"Ngữ pháp","type":"grammar-title","prompt":"Giải thích này thuộc điểm ngữ pháp nào? Dùng để hỏi người nghe chọn một trong hai hoặc nhiều phương án.","options":["A 还是 B","连动句","（正在 / 在）……呢","有（一）点儿"],"answer":0,"explanation":"Điểm ngữ pháp là “A 还是 B”. Dùng để hỏi người nghe chọn một trong hai hoặc nhiều phương án.","source":"Bài 17"},{"section":"Ví dụ ngữ pháp","type":"grammar-example","prompt":"Câu sau minh họa điểm ngữ pháp nào? 星期天可去的地方很多。 Xīngqītiān kě qù de dìfang hěn duō. Chủ nhật có nhiều nơi đáng đi.","options":["得（děi）","可 + V","选择问句：是……还是……","如果……的话，就……"],"answer":1,"explanation":"Câu này dùng điểm ngữ pháp “可 + V”.","source":"Bài 15"},{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “không giống nhau”?","options":["不同","好吃","换","脏"],"answer":0,"explanation":"Đáp án đúng là “不同”, đọc là bù tóng.","source":"Bài 16"},{"section":"Từ vựng","type":"meaning","prompt":"“还可以” nghĩa là gì?","options":["bình thường, tạm được","hết sức, thỏa thích","đông đúc","bẩn"],"answer":0,"explanation":"“还可以” đọc là hái kěyǐ, nghĩa là “bình thường, tạm được”.","source":"Bài 13"},{"section":"Ngữ pháp","type":"grammar-title","prompt":"Giải thích này thuộc điểm ngữ pháp nào? 挺 biểu thị mức độ khá cao, tương đương 很; trong câu thường dùng thêm 的.","options":["挺 + adj.","\"咱们\"和\"我们\"","选择问句：是……还是……","星期的表达法"],"answer":0,"explanation":"Điểm ngữ pháp là “挺 + adj.”. 挺 biểu thị mức độ khá cao, tương đương 很; trong câu thường dùng thêm 的.","source":"Bài 14"},{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “sạch sẽ”?","options":["干净","偷懒","出去","安排"],"answer":0,"explanation":"Đáp án đúng là “干净”, đọc là gānjìng.","source":"Bài 17"},{"section":"Pinyin","type":"pinyin","prompt":"Pinyin đúng của “了” là gì?","options":["gānjìng","tǐng","róngyì","le"],"answer":3,"explanation":"Pinyin của “了” là le.","source":"Bài 16"},{"section":"Từ vựng","type":"meaning","prompt":"“学习” nghĩa là gì?","options":["học tập","gói","túi, gói","hay là"],"answer":0,"explanation":"“学习” đọc là xuéxí, nghĩa là “học tập”.","source":"Bài 16"},{"section":"Luyện tập tổng hợp","type":"application-fill","prompt":"选词填空 用 就、从、在、最、挺、比较；先、以后、然后、差不多、常常、所以 填空。","options":["按语境选择所给词语。","哎呀","先","一直"],"answer":0,"explanation":"Cần điền “按语境选择所给词语。” để câu đúng nghĩa và đúng cấu trúc.","source":"Bài 15"},{"section":"Ví dụ ngữ pháp","type":"grammar-example","prompt":"Câu sau minh họa điểm ngữ pháp nào? 学生们去教学楼上课。 Xuéshengmen qù jiàoxuélóu shàng kè. Các học sinh đi tòa nhà học lên lớp.","options":["得（děi）","连动句","A 还是 B","\"咱们\"和\"我们\""],"answer":1,"explanation":"Câu này dùng điểm ngữ pháp “连动句”.","source":"Bài 13"},{"section":"Từ vựng","type":"meaning","prompt":"“绿” nghĩa là gì?","options":["có thể, đáng","màu đen","trà","màu xanh lục"],"answer":3,"explanation":"“绿” đọc là lǜ, nghĩa là “màu xanh lục”.","source":"Bài 14"},{"section":"Ví dụ ngữ pháp","type":"grammar-example","prompt":"Câu sau minh họa điểm ngữ pháp nào? 听说北京的冬天很冷。 Tīngshuō Běijīng de dōngtiān hěn lěng. Nghe nói mùa đông Bắc Kinh rất lạnh.","options":["会（1）","“的”字词组","形容词谓语","\"咱们\"和\"我们\""],"answer":2,"explanation":"Câu này dùng điểm ngữ pháp “形容词谓语”.","source":"Bài 15"},{"section":"Điền từ","type":"fill","prompt":"请说“______”。 Qǐng shuō “Huì”. Hãy nói “biết”.","options":["开门","会","咱们","觉得"],"answer":1,"explanation":"Câu đầy đủ là “请说“会”。”. Cần dùng “会” vì nghĩa là “biết”.","source":"Bài 17"},{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “sắp xếp”?","options":["借","安排","花","有点儿"],"answer":1,"explanation":"Đáp án đúng là “安排”, đọc là ānpái.","source":"Bài 16"},{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “cùng, cùng nhau”?","options":["别的","一起","有意思","过"],"answer":1,"explanation":"Đáp án đúng là “一起”, đọc là yīqǐ.","source":"Bài 13"},{"section":"Cấu trúc","type":"grammar-structure","prompt":"Cấu trúc đúng của “动词重叠” là gì?","options":["星期 + 数字 / 日 / 天","在 + 地点 + V","V 一 V / V V","主语 + 得 + 动词"],"answer":2,"explanation":"Cấu trúc cần nhớ: V 一 V / V V.","source":"Bài 16"},{"section":"Cấu trúc","type":"grammar-structure","prompt":"Cấu trúc đúng của “\"A不A\"和\"V不V\"” là gì?","options":["太 + 形容词 + 了","V 一 V / V V","主语 + 正在 / 在 + 动词 + 呢","A不A / V不V"],"answer":3,"explanation":"Cấu trúc cần nhớ: A不A / V不V.","source":"Bài 13"},{"section":"Luyện tập tổng hợp","type":"application-fill","prompt":"动词重叠 我们去商店 ______。","options":["又","关门","逛逛","味道"],"answer":2,"explanation":"Cần điền “逛逛” để câu đúng nghĩa và đúng cấu trúc.","source":"Bài 16"},{"section":"Nghe hiểu bài khóa","type":"speaker","prompt":"Trong bài khóa, ai nói câu này? 你们会包饺子吗？中午在我家吃饺子，怎么样？","options":["刘老师","中村","玛丽","同学"],"answer":0,"explanation":"Người nói câu này là 刘老师.","source":"Bài 17"},{"section":"Nghe hiểu bài khóa","type":"speaker","prompt":"Trong bài khóa, ai nói câu này? 你打算送给谁？男的还是女的？","options":["李军","大卫","同学","中村"],"answer":1,"explanation":"Người nói câu này là 大卫.","source":"Bài 15"},{"section":"Pinyin","type":"pinyin","prompt":"Pinyin đúng của “比如” là gì?","options":["hào","è","bǐrú","jiǎozi"],"answer":2,"explanation":"Pinyin của “比如” là bǐrú.","source":"Bài 15"},{"section":"Ngữ pháp","type":"grammar-title","prompt":"Giải thích này thuộc điểm ngữ pháp nào? \"咱们\" thường bao gồm cả người nói và người nghe.,\"我们\" có thể bao gồm cả người nói và người nghe, cũng có thể không bao gồm người nghe.,Chú ý: \"咱们\" luôn bao hàm người đang nói chuyện với mình, còn \"我们\" thì chưa chắc.","options":["先……然后……","太……了","\"咱们\"和\"我们\"","可 + V"],"answer":2,"explanation":"Điểm ngữ pháp là “\"咱们\"和\"我们\"”. \"咱们\" thường bao gồm cả người nói và người nghe.,\"我们\" có thể bao gồm cả người nói và người nghe, cũng có thể không bao gồm người nghe.,Chú ý: \"咱们\" luôn bao hàm người đang nói chuyện với mình, còn \"我们\" thì chưa chắc.","source":"Bài 13"},{"section":"Luyện tập tổng hợp","type":"application-fill","prompt":"替换练习 我去图书馆借书。→（商店买东西 / 银行换钱 / 购物中心买衣服）","options":["味道","超市","电视","我去商店买东西。/ 我去银行换钱。/ 我去购物中心买衣服。"],"answer":3,"explanation":"Cần điền “我去商店买东西。/ 我去银行换钱。/ 我去购物中心买衣服。” để câu đúng nghĩa và đúng cấu trúc.","source":"Bài 13"},{"section":"Điền từ","type":"fill","prompt":"我______打算买衣服呢。 Wǒ zhèng dǎsuàn mǎi yīfu ne. Tôi đang định mua quần áo đây.","options":["正","质量","果汁","衣服"],"answer":0,"explanation":"Câu đầy đủ là “我正打算买衣服呢。”. Cần dùng “正” vì nghĩa là “đúng lúc, đang”.","source":"Bài 13"},{"section":"Luyện tập tổng hợp","type":"application-mc","prompt":"选择 明天又是周末，太 ______ 了！","options":["高兴","不同","亲自","音乐会"],"answer":0,"explanation":"Đáp án đúng là “高兴”.","source":"Bài 16"},{"section":"Cấu trúc","type":"grammar-structure","prompt":"Cấu trúc đúng của “太……了” là gì?","options":["主语 + 动词1 + 宾语 + 动词2","先 + VP₁，然后 + VP₂","主语 + 会 + 动词","太 + 形容词 + 了"],"answer":3,"explanation":"Cấu trúc cần nhớ: 太 + 形容词 + 了.","source":"Bài 16"},{"section":"Từ vựng","type":"meaning","prompt":"“上” nghĩa là gì?","options":["thật, thật sự","lượng từ chỉ xe cộ","trên","lại"],"answer":2,"explanation":"“上” đọc là shàng, nghĩa là “trên”.","source":"Bài 17"},{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “đối... mà nói”?","options":["银行","对……来说","洗","星期天"],"answer":1,"explanation":"Đáp án đúng là “对……来说”, đọc là duì...lái shuō.","source":"Bài 18"},{"section":"Luyện tập tổng hợp","type":"application-mc","prompt":"选择正确答案 他先去图书馆，___ 回宿舍。","options":["A. 然后","B. 先","C. 也","D. 还"],"answer":0,"explanation":"Đáp án đúng là “A. 然后”.","source":"Bài 13"},{"section":"Ngữ pháp","type":"grammar-title","prompt":"Giải thích này thuộc điểm ngữ pháp nào? Có thể dùng “如果……的话” hoặc chỉ dùng “如果”.","options":["太……了","如果……的话，就……","挺 + adj.","从……到……"],"answer":1,"explanation":"Điểm ngữ pháp là “如果……的话，就……”. Có thể dùng “如果……的话” hoặc chỉ dùng “如果”.","source":"Bài 18"},{"section":"Điền từ","type":"fill","prompt":"请说“______”。 Qǐng shuō “Chá”. Hãy nói “trà”.","options":["茶","送","男","得"],"answer":0,"explanation":"Câu đầy đủ là “请说“茶”。”. Cần dùng “茶” vì nghĩa là “trà”.","source":"Bài 17"},{"section":"Từ vựng","type":"meaning","prompt":"“蓝” nghĩa là gì?","options":["chủ nhật","đi taxi","màu xanh lam","náo nhiệt, sôi nổi"],"answer":2,"explanation":"“蓝” đọc là lán, nghĩa là “màu xanh lam”.","source":"Bài 14"},{"section":"Từ vựng","type":"meaning","prompt":"“黑” nghĩa là gì?","options":["học tập","áo len","đi ra ngoài","màu đen"],"answer":3,"explanation":"“黑” đọc là hēi, nghĩa là “màu đen”.","source":"Bài 14"},{"section":"Từ vựng","type":"meaning","prompt":"“可” nghĩa là gì?","options":["lại","màu xanh lục","có thể, đáng","làm khách"],"answer":2,"explanation":"“可” đọc là kě, nghĩa là “có thể, đáng”.","source":"Bài 15"},{"section":"Pinyin","type":"pinyin","prompt":"Pinyin đúng của “晚饭” là gì?","options":["zuótiān","wǎnfàn","lán","jiù"],"answer":1,"explanation":"Pinyin của “晚饭” là wǎnfàn.","source":"Bài 15"},{"section":"Ngữ pháp","type":"grammar-title","prompt":"Giải thích này thuộc điểm ngữ pháp nào? Dùng 星期一 đến 星期日/星期天.","options":["挺 + adj.","\"A不A\"和\"V不V\"","星期的表达法","每……都……"],"answer":2,"explanation":"Điểm ngữ pháp là “星期的表达法”. Dùng 星期一 đến 星期日/星期天.","source":"Bài 15"},{"section":"Pinyin","type":"pinyin","prompt":"Pinyin đúng của “黑” là gì?","options":["dǎsuàn","nǚ","hēi","zhǔnbèi"],"answer":2,"explanation":"Pinyin của “黑” là hēi.","source":"Bài 14"},{"section":"Bài khóa","type":"text-meaning","prompt":"Câu “这个周末你干什么？” nghĩa là gì? Zhège zhōumò nǐ gàn shénme?","options":["Cuối tuần này bạn làm gì?","Chào Lý Quân. Bạn đi đâu vậy?","Người miền Bắc thích, người miền Nam thích cơm.","Các em biết gói sủi cảo không? Trưa ăn sủi cảo ở nhà thầy/cô nhé?"],"answer":0,"explanation":"“这个周末你干什么？” nghĩa là “Cuối tuần này bạn làm gì?”.","source":"Bài 16"},{"section":"Bài khóa","type":"text-meaning","prompt":"Câu “有时候和朋友一起逛商店，有时候去图书馆学习。” nghĩa là gì? Yǒu shíhou hé péngyou yìqǐ guàng shāngdiàn, yǒu shíhou qù túshūguǎn xuéxí.","options":["Có lúc đi dạo cửa hàng với bạn, có lúc đến thư viện học.","Tôi đi nghe hòa nhạc. Cùng đi nhé?","Khá đẹp. Nhưng màu trắng dễ bẩn. Chiếc màu xanh này thế nào?","Không giỏi lắm, chúng em thử xem!"],"answer":0,"explanation":"“有时候和朋友一起逛商店，有时候去图书馆学习。” nghĩa là “Có lúc đi dạo cửa hàng với bạn, có lúc đến thư viện học.”.","source":"Bài 16"},{"section":"Pinyin","type":"pinyin","prompt":"Pinyin đúng của “干净” là gì?","options":["zhèng","shāngdiàn","gānjìng","dōngxi"],"answer":2,"explanation":"Pinyin của “干净” là gānjìng.","source":"Bài 17"},{"section":"Bài khóa","type":"text-meaning","prompt":"Câu “你们会包饺子吗？中午在我家吃饺子，怎么样？” nghĩa là gì? Nǐmen huì bāo jiǎozi ma? Zhōngwǔ zài wǒ jiā chī jiǎozi, zěnmeyàng?","options":["Đúng vậy, tự làm thì đặc biệt hơn.","Các em biết gói sủi cảo không? Trưa ăn sủi cảo ở nhà thầy/cô nhé?","Người miền Bắc thích, người miền Nam thích cơm.","Đầu tiên tôi đi ngân hàng đổi tiền, sau đó đi cửa hàng mua đồ."],"answer":1,"explanation":"“你们会包饺子吗？中午在我家吃饺子，怎么样？” nghĩa là “Các em biết gói sủi cảo không? Trưa ăn sủi cảo ở nhà thầy/cô nhé?”.","source":"Bài 17"}];
    const LETTERS = ["A", "B", "C", "D"];
    const state = {};

    function esc(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function renderQuiz() {
      const root = document.getElementById("quiz");
      document.getElementById("total").textContent = quizData.length;
      let currentSection = "";
      root.innerHTML = "";
      quizData.forEach((item, index) => {
        if (item.section !== currentSection) {
          currentSection = item.section;
          const section = document.createElement("div");
          section.className = "section-title";
          section.textContent = currentSection;
          root.appendChild(section);
        }
        const card = document.createElement("section");
        card.className = "question-card";
        card.id = "q-" + index;
        const options = item.options.map((option, optionIndex) => `
          <label class="option" id="q-${index}-o-${optionIndex}">
            <input type="radio" name="q-${index}" value="${optionIndex}" onchange="choose(${index}, ${optionIndex})">
            <span><strong>${LETTERS[optionIndex]}.</strong> ${esc(option)}</span>
          </label>
        `).join("");
        card.innerHTML = `
          <div class="q-meta"><span>Câu ${index + 1} · ${esc(item.type)}</span><span>${esc(item.source)}</span></div>
          <div class="prompt">${esc(item.prompt)}</div>
          <div class="options">${options}</div>
          <div class="explanation" id="q-${index}-explain"></div>
        `;
        root.appendChild(card);
      });
    }

    function choose(index, optionIndex) {
      state[index] = optionIndex;
      updateProgress();
    }

    function updateProgress() {
      document.getElementById("answered").textContent = Object.keys(state).length;
    }

    function submitQuiz() {
      let correct = 0;
      quizData.forEach((item, index) => {
        const selected = state[index];
        const card = document.getElementById("q-" + index);
        const explain = document.getElementById("q-" + index + "-explain");
        card.classList.remove("correct-card", "wrong-card");
        item.options.forEach((_, optionIndex) => {
          const option = document.getElementById("q-" + index + "-o-" + optionIndex);
          option.classList.remove("correct", "wrong");
          if (optionIndex === item.answer) option.classList.add("correct");
          if (selected === optionIndex && selected !== item.answer) option.classList.add("wrong");
        });
        const isCorrect = selected === item.answer;
        if (isCorrect) correct++;
        card.classList.add(isCorrect ? "correct-card" : "wrong-card");
        const selectedText = selected === undefined ? "Chưa chọn" : LETTERS[selected] + ". " + item.options[selected];
        const correctText = LETTERS[item.answer] + ". " + item.options[item.answer];
        explain.innerHTML = `
          <strong>${isCorrect ? "Đúng" : "Chưa đúng"}.</strong><br>
          Bạn chọn: ${esc(selectedText)}<br>
          Đáp án đúng: ${esc(correctText)}<br>
          Giải thích: ${esc(item.explanation)}
        `;
        explain.classList.add("show");
      });
      const percent = Math.round(correct / quizData.length * 100);
      const result = document.getElementById("result");
      result.innerHTML = `<strong>${correct}/${quizData.length} câu đúng · ${percent}%</strong><br>Phần đáp án và giải thích đã hiện ngay dưới từng câu.`;
      result.classList.add("show");
      result.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    function resetQuiz() {
      for (const key of Object.keys(state)) delete state[key];
      document.querySelectorAll("input[type=radio]").forEach((input) => { input.checked = false; });
      document.querySelectorAll(".option").forEach((el) => el.classList.remove("correct", "wrong"));
      document.querySelectorAll(".question-card").forEach((el) => el.classList.remove("correct-card", "wrong-card"));
      document.querySelectorAll(".explanation").forEach((el) => { el.classList.remove("show"); el.innerHTML = ""; });
      document.getElementById("result").classList.remove("show");
      updateProgress();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    renderQuiz();
  </script>
