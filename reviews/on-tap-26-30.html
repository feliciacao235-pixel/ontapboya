nt-size:clamp(4.2rem,10vw,7rem);font-weight:900;color:var(--red);line-height:.96}.vocab .pinyin{font-size:clamp(1.35rem,3.2vw,2rem);margin-top:10px}.meaning{font-size:clamp(1.2rem,2.6vw,1.7rem);font-weight:900;color:var(--burgundy);margin-top:3px}.meta{color:var(--muted);font-size:.95rem}.usage{font-size:1.02rem;margin-top:10px;color:#403833}.examples{margin-top:18px;border-top:1px solid var(--line);padding-top:12px;display:grid;gap:12px}.ex{margin:0}.ex-cn{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:clamp(1.35rem,3vw,1.75rem);font-weight:900}.vocab-side{display:grid;gap:14px}.vocab-image{margin:0;min-height:210px;border:1.5px dashed #d8b07a;border-radius:10px;background:#fffaf1;display:grid;grid-template-rows:1fr auto;overflow:hidden}.vocab-image img{width:100%;height:100%;min-height:210px;object-fit:cover;display:block}.vocab-image figcaption{padding:8px 10px;background:white;color:var(--muted);font-size:.88rem;border-top:1px solid var(--line)}.vocab-image.panda-default{border-style:solid;background:#fffaf1}.vocab-image.panda-default img{object-fit:cover;object-position:center}.stroke-area{background:var(--light);border:1px solid var(--line);border-radius:10px;padding:12px}.stroke-title{font-family:"Noto Serif SC","Microsoft YaHei",serif;font-size:1.22rem;color:var(--burgundy);font-weight:900}.stroke-title span{font-family:inherit;color:var(--muted);font-size:1rem}.stroke-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px;margin-top:10px}.stroke-card{background:white;border:1px solid var(--line);border-radius:9px;min-height:122px;display:grid;grid-template-rows:1fr auto;align-items:center;justify-items:center;padding:8px}.stroke-card img{max-width:100%;height:82px;object-fit:contain}.stroke-card span{font-family:"Noto Serif SC","Microsoft YaHei",serif;color:var(--burgundy);font-weight:900}.stroke-card.missing{border-style:dashed;background:#fffaf1;align-items:stretch}.radical-note{width:100%;display:grid;gap:5 a(82,45,29,.08)}.exercise-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.teacher-badge{background:var(--light);border:1px solid var(--line);color:var(--burgundy);border-radius:999px;padding:6px 10px;font-size:.84rem;font-weight:900;white-space:nowrap}.exercise-stage{display:flex;align-items:center;gap:8px;margin-top:14px;color:var(--burgundy)}.exercise-stage span{width:25px;height:25px;border-radius:50%;background:var(--burgundy);color:white;display:grid;place-items:center;font-weight:900}.exercise-stage.answer-stage{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}.exercise-title{font-family:"Noto Serif SC","Microsoft YaHei",serif;color:var(--burgundy);font-size:1.35rem;font-weight:900}.exercise-instruction{font-weight:800;margin-top:6px}.exercise-q{font-weight:900;font-size:1.16rem;white-space:pre-line;background:var(--ivory);border:1px solid var(--line);border-radius:9px;padding:12px;margin-top:12px}.exercise-q.situation{font-weight:700;color:#403833}.keyword-bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.keyword-bank span{background:#fffaf1;border:1px solid var(--line);border-radius:999px;padding:6px 10px;color:var(--burgundy);font-weight:900}.write-lines{display:grid;gap:12px;margin-top:14px}.write-lines span{display:block;height:42px;border-bottom:2px solid var(--line)}.answer-panel{margin-top:10px;border:1px solid var(--line);border-radius:9px;background:#fffaf1;padding:10px}.answer-panel summary{cursor:pointer;color:var(--burgundy);font-weight:900}.answer-main{font-size:1.05rem;margin-top:8px;color:#0f5528}.answer-cn{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:1.18rem;font-weight:900;margin-top:8px}.answer-explain{margin-top:8px;border-top:1px solid var(--line);padding-top:8px;color:#403833}.options{display:grid;gap:8px;margin-top:10px}.option{display:grid;grid-template-columns:32px 1fr;gap:8px;align-items:start;width:100%;border:1px solid var(--line);background:var(--light);border-radius:8px;padding:10px 12px;text-align:left;font-size:1rem}.option.teacher-answer.show-answer{background:var(--okbg);border-color:var(--ok);color:#0f5528;font-weight:900}.option.correct{background:var(--okbg);border-color:var(--ok);color:#0f5528;font-weight:900}.option.wrong{background:var(--badbg);border-color:var(--bad);color:#8f1919}.explain{display:none;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}.explain.show{display:block}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.btn{border:0;border-radius:8px;background:var(--red);color:white;padding:12px 16px;font-weight:900}.btn.secondary{background:var(--beige);color:var(--burgundy)}.result{display:none;background:var(--burgundy);color:white;border-radius:10px;padding:16px;margin:18px 0}.result.show{display:block}.index-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.lesson-link{display:block;text-decoration:none;color:var(--text);background:white;border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:0 10px 28px rgba(82,45,29,.08)}.lesson-link b{color:var(--burgundy);font-size:1.1rem}.review-link{border-color:#d8b07a;background:#fffaf1}@media(max-width:860px){.vocab-body{grid-template-columns:1fr}.vocab-side{order:-1}.vocab .hanzi{font-size:clamp(4rem,18vw,6rem)}.vocab-image{min-height:180px}.vocab-image img{min-height:180px}.grammar-detail,.grammar-examples{grid-template-columns:1fr}}@media(max-width:760px){.index-grid{grid-template-columns:1fr}.dialogue .turn{grid-template-columns:36px 1fr}.hero{padding:26px 0}.section-title{display:block}.topnav a{font-size:.86rem}.card{padding:14px}.vocab{padding:0}.vocab-body{padding:14px}.turn-cn{font-size:1.16rem}.stroke-grid{grid-template-columns:repeat(auto-fit,minmax(128px,1fr))}.practice-tools{top:48px;justify-content:stretch}.practice-tools button{flex:1}.exercise-top{display:block}.teacher-badge{display:inline-block;margin-top:8px}}

<script>
const quizData=[{"section":"Từ vựng","type":"meaning","prompt":"“标准” nghĩa là gì?","options":["bổ ngữ","nỗ lực, cố gắng","bài hát","chuẩn, đúng"],"answer":3,"explanation":"“标准” đọc là biāozhǔn, nghĩa là “chuẩn, đúng”.","source":"Bài 30"},{"section":"Ngữ pháp","type":"grammar","prompt":"Giải thích này thuộc điểm ngữ pháp nào? Dùng để biểu thị cảm xúc mạnh về mức độ.","options":["可能","动量词 遍","想 / 要","多……啊"],"answer":3,"explanation":"Điểm ngữ pháp là “多……啊”.","source":"Bài 30"},{"section":"Bài khóa","type":"textbook","prompt":"Câu “明天开始。现在我每天复习，看书看得头疼，都快累死了。” nghĩa là gì? Míngtiān kāishǐ. Xiànzài wǒ měi tiān fùxí, kàn shū kàn de tóuténg, dōu kuài lèi sǐ le.","options":["Đừng lo, bạn nhất định có thể giải quyết vấn đề này.","Vậy à? Bạn định thi nghiên cứu sinh ngành nào?","Sắp nghỉ rồi, bạn có kế hoạch gì?","Ngày mai bắt đầu. Bây giờ ngày nào tôi cũng ôn, đọc sách đến đau đầu, sắp mệt chết rồi."],"answer":3,"explanation":"“明天开始。现在我每天复习，看书看得头疼，都快累死了。” nghĩa là “Ngày mai bắt đầu. Bây giờ ngày nào tôi cũng ôn, đọc sách đến đau đầu, sắp mệt chết rồi.”.","source":"Bài 28"},{"section":"Từ vựng","type":"meaning","prompt":"“够” nghĩa là gì?","options":["có hứng thú, say mê","cơ sở, nền tảng","đủ","lượng từ (chuyến...)"],"answer":2,"explanation":"“够” đọc là gòu, nghĩa là “đủ”.","source":"Bài 28"},{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “buổi liên hoan”?","options":["门","行李","复习","联欢会"],"answer":3,"explanation":"Đáp án đúng là “联欢会”, đọc là liánhuānhuì.","source":"Bài 30"},{"section":"Từ vựng","type":"meaning","prompt":"“效果” nghĩa là gì?","options":["chăm chỉ, chịu khó","tại sao, vì sao","biên soạn","hiệu quả"],"answer":3,"explanation":"“效果” đọc là xiàoguǒ, nghĩa là “hiệu quả”.","source":"Bài 28"},{"section":"Từ vựng","type":"meaning","prompt":"“确实” nghĩa là gì?","options":["hành lý","hãy, rồi lại","thanh điệu","thực sự"],"answer":3,"explanation":"“确实” đọc là quèshí, nghĩa là “thực sự”.","source":"Bài 28"},{"section":"Điền từ","type":"fill","prompt":"房间太乱了，要______一下。 Fángjiān tài luàn le, yào shōushi yíxià. Phòng quá bừa rồi, phải dọn một chút.","options":["出发","待","考上","收拾"],"answer":3,"explanation":"Câu đầy đủ là “房间太乱了，要收拾一下。”.","source":"Bài 30"},{"section":"Điền từ","type":"fill","prompt":"我买了一张______。 Wǒ mǎi le yì zhāng míngxìnpiàn. Tôi đã mua một tấm bưu thiếp.","options":["刚才","表演","毕业","明信片"],"answer":3,"explanation":"Câu đầy đủ là “我买了一张明信片。”.","source":"Bài 26"},{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “chữ Hán”?","options":["硬座","汉字","寄","光盘"],"answer":1,"explanation":"Đáp án đúng là “汉字”, đọc là Hànzì.","source":"Bài 28"},{"section":"Điền từ","type":"fill","prompt":"考试______结束了。 Kǎoshì zhōngyú jiéshù le. Kỳ thi cuối cùng cũng kết thúc rồi.","options":["新年","整整","出发","终于"],"answer":3,"explanation":"Câu đầy đủ là “考试终于结束了。”.","source":"Bài 29"},{"section":"Pinyin","type":"pinyin","prompt":"Pinyin đúng của “贺卡” là gì?","options":["jiějué","hèkǎ","jìhuà","xiàoguǒ"],"answer":1,"explanation":"Pinyin của “贺卡” là hèkǎ.","source":"Bài 26"},{"section":"Pinyin","type":"pinyin","prompt":"Pinyin đúng của “决定” là gì?","options":["yóujú","nǔlì","xīnnián","juédìng"],"answer":3,"explanation":"Pinyin của “决定” là juédìng.","source":"Bài 26"},{"section":"Pinyin","type":"pinyin","prompt":"Pinyin đúng của “新年” là gì?","options":["jiàoshòu","piào","gǎn xìngqù","xīnnián"],"answer":3,"explanation":"Pinyin của “新年” là xīnnián.","source":"Bài 26"},{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “phương pháp”?","options":["考虑","另外","邮票","方法"],"answer":3,"explanation":"Đáp án đúng là “方法”, đọc là fāngfǎ.","source":"Bài 28"},{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “nhớ”?","options":["慢","帮助","标准","想念"],"answer":3,"explanation":"Đáp án đúng là “想念”, đọc là xiǎngniàn.","source":"Bài 27"},{"section":"Từ vựng","type":"meaning","prompt":"“补” nghĩa là gì?","options":["báo cáo","bổ sung, bù, thêm","xếp hàng","miễn bàn, đừng nhắc"],"answer":1,"explanation":"“补” đọc là bǔ, nghĩa là “bổ sung, bù, thêm”.","source":"Bài 29"},{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “tàu hỏa”?","options":["快要","地方","火车","教授"],"answer":2,"explanation":"Đáp án đúng là “火车”, đọc là huǒchē.","source":"Bài 29"},{"section":"Từ vựng","type":"meaning","prompt":"“发音” nghĩa là gì?","options":["đề thi, câu hỏi","khiêm tốn","gửi","phát âm"],"answer":3,"explanation":"“发音” đọc là fāyīn, nghĩa là “phát âm”.","source":"Bài 30"},{"section":"Bài khóa","type":"textbook","prompt":"Câu “你唱歌唱得那么好，还需要准备吗？” nghĩa là gì? Nǐ chànggē chàng de nàme hǎo, hái xūyào zhǔnbèi ma?","options":["Không cần chuẩn bị. Nhưng có lẽ sẽ để bạn biểu diễn một tiết mục.","Quyết định rồi, đi Cáp Nhĩ Tân.","Bạn có thể lên tàu đổi bù vé giường nằm, có thể vẫn còn giường nằm.","Bạn hát hay như vậy, vẫn cần chuẩn bị à?"],"answer":3,"explanation":"“你唱歌唱得那么好，还需要准备吗？” nghĩa là “Bạn hát hay như vậy, vẫn cần chuẩn bị à?”.","source":"Bài 30"},{"section":"Từ vựng","type":"meaning","prompt":"“表演” nghĩa là gì?","options":["khó","khiêm tốn","biểu diễn","đề thi, câu hỏi"],"answer":2,"explanation":"“表演” đọc là biǎoyǎn, nghĩa là “biểu diễn”.","source":"Bài 29"},{"section":"Bài khóa","type":"textbook","prompt":"Câu “不，我想唱一首民歌。” nghĩa là gì? Bù, wǒ xiǎng chàng yì shǒu míngē.","options":["Đối với người Âu Mỹ, chữ Hán thật sự hơi khó.","Sắp nghỉ rồi, chúng tôi định đi du lịch trong kỳ nghỉ, bạn muốn đi cùng không?","Chủ nhật xuất phát.","Không, tôi muốn hát một bài dân ca."],"answer":3,"explanation":"“不，我想唱一首民歌。” nghĩa là “Không, tôi muốn hát một bài dân ca.”.","source":"Bài 30"},{"section":"Điền từ","type":"fill","prompt":"我这个星期考三______课。 Wǒ zhè ge xīngqī kǎo sān mén kè. Tuần này tôi thi ba môn.","options":["教授","故事","出发","门"],"answer":3,"explanation":"Câu đầy đủ là “我这个星期考三门课。”.","source":"Bài 28"},{"section":"Từ vựng","type":"meaning","prompt":"“怕” nghĩa là gì?","options":["sợ, e ngại","lời bài hát","bài tập","biểu diễn"],"answer":0,"explanation":"“怕” đọc là pà, nghĩa là “sợ, e ngại”.","source":"Bài 30"},{"section":"Từ vựng","type":"meaning","prompt":"“张” nghĩa là gì?","options":["thực sự","chuẩn, đúng","hiệu quả","lượng từ (tờ, tấm)"],"answer":3,"explanation":"“张” đọc là zhāng, nghĩa là “lượng từ (tờ, tấm)”.","source":"Bài 29"},{"section":"Ngữ pháp","type":"grammar","prompt":"Giải thích này thuộc điểm ngữ pháp nào? Dùng để nhấn mạnh mức độ.","options":["再","都","只好","极了"],"answer":3,"explanation":"Điểm ngữ pháp là “极了”.","source":"Bài 30"},{"section":"Pinyin","type":"pinyin","prompt":"Pinyin đúng của “呀” là gì?","options":["wǎnhuì","ya","bàogào","jí le"],"answer":1,"explanation":"Pinyin của “呀” là ya.","source":"Bài 28"},{"section":"Điền từ","type":"fill","prompt":"______谁来了？ Gāngcái shéi lái le? Vừa nãy ai đến?","options":["复习","趟","收拾","刚才"],"answer":3,"explanation":"Câu đầy đủ là “刚才谁来了？”.","source":"Bài 26"},{"section":"Từ vựng","type":"meaning","prompt":"“决定” nghĩa là gì?","options":["quyết định","hãy, rồi lại","bổ sung, bù, thêm","bổ ngữ"],"answer":0,"explanation":"“决定” đọc là juédìng, nghĩa là “quyết định”.","source":"Bài 26"},{"section":"Pinyin","type":"pinyin","prompt":"Pinyin đúng của “邮局” là gì?","options":["wán","de","juédìng","yóujú"],"answer":3,"explanation":"Pinyin của “邮局” là yóujú.","source":"Bài 26"},{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “tiết mục”?","options":["节目","熟悉","阅读","放松"],"answer":0,"explanation":"Đáp án đúng là “节目”, đọc là jiémù.","source":"Bài 29"},{"section":"Ngữ pháp","type":"grammar","prompt":"Giải thích này thuộc điểm ngữ pháp nào? Biểu thị khả năng.","options":["常用结果补语小结（1）","快 / 要 / 快要……了","会（2）","可能"],"answer":3,"explanation":"Điểm ngữ pháp là “可能”.","source":"Bài 30"},{"section":"Ngữ pháp","type":"grammar","prompt":"Giải thích này thuộc điểm ngữ pháp nào? Dùng 会 để nói khả năng trong tương lai.","options":["想 / 要","动量词","只好","会（2）"],"answer":3,"explanation":"Điểm ngữ pháp là “会（2）”.","source":"Bài 30"},{"section":"Bài khóa","type":"textbook","prompt":"Câu “决定了，去哈尔滨。” nghĩa là gì? Juédìng le, qù Hā'ěrbīn.","options":["Phát âm của tôi không tốt lắm, họ có nghe hiểu không?","Đúng, chúng tôi đã mua được vé rồi, nhưng chỉ mua được ba vé giường nằm, một vé khác là ghế cứng.","Tôi vẫn chưa chuẩn bị xong hành lý, lần sau nhé!","Quyết định rồi, đi Cáp Nhĩ Tân."],"answer":3,"explanation":"“决定了，去哈尔滨。” nghĩa là “Quyết định rồi, đi Cáp Nhĩ Tân.”.","source":"Bài 29"},{"section":"Điền từ","type":"fill","prompt":"快考试了，我得______。 Kuài kǎoshì le, wǒ děi yònggōng. Sắp thi rồi, tôi phải chăm chỉ.","options":["张","谦虚","用功","上"],"answer":2,"explanation":"Câu đầy đủ là “快考试了，我得用功。”.","source":"Bài 26"},{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “ghế nằm, giường nằm trên tàu”?","options":["谦虚","联欢会","想念","卧铺"],"answer":3,"explanation":"Đáp án đúng là “卧铺”, đọc là wòpù.","source":"Bài 29"},{"section":"Pinyin","type":"pinyin","prompt":"Pinyin đúng của “功课” là gì?","options":["fāyīn","hǎotīng","gōngkè","jiàoshòu"],"answer":2,"explanation":"Pinyin của “功课” là gōngkè.","source":"Bài 27"},{"section":"Pinyin","type":"pinyin","prompt":"Pinyin đúng của “火车” là gì?","options":["kuài","jǐnzhāng","cì","huǒchē"],"answer":3,"explanation":"Pinyin của “火车” là huǒchē.","source":"Bài 29"},{"section":"Ngữ pháp","type":"grammar","prompt":"Giải thích này thuộc điểm ngữ pháp nào? Dùng khi một hành động được làm từ đầu đến cuối một lượt.","options":["带“得”的状态补语","只好","可能","动量词 遍"],"answer":3,"explanation":"Điểm ngữ pháp là “动量词 遍”.","source":"Bài 27"},{"section":"Điền từ","type":"fill","prompt":"这个问题有两个______。 Zhè ge wèntí yǒu liǎng ge fāngmiàn. Vấn đề này có hai phương diện.","options":["歌曲","方面","编","历史"],"answer":1,"explanation":"Câu đầy đủ là “这个问题有两个方面。”.","source":"Bài 27"},{"section":"Ngữ pháp","type":"grammar","prompt":"Giải thích này thuộc điểm ngữ pháp nào? Nếu tân ngữ và bổ ngữ cùng xuất hiện, động từ phải lặp lại trước 得.","options":["带“得”的状态补语","极了","快 / 要 / 快要……了","多……啊"],"answer":0,"explanation":"Điểm ngữ pháp là “带“得”的状态补语”.","source":"Bài 28"},{"section":"Từ vựng","type":"meaning","prompt":"“为什么” nghĩa là gì?","options":["tại sao, vì sao","năm mới","tem","đẹp"],"answer":0,"explanation":"“为什么” đọc là wèi shénme, nghĩa là “tại sao, vì sao”.","source":"Bài 28"},{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “khiêm tốn”?","options":["得","有些","张","谦虚"],"answer":3,"explanation":"Đáp án đúng là “谦虚”, đọc là qiānxū.","source":"Bài 29"},{"section":"Bài khóa","type":"textbook","prompt":"Câu “你可以上车补卧铺票，可能还有卧铺。” nghĩa là gì? Nǐ kěyǐ shàng chē bǔ wòpù piào, kěnéng hái yǒu wòpù.","options":["Hôm nay tôi muốn tham gia một buổi liên hoan của sinh viên Trung Quốc, đang chuẩn bị tiết mục.","Vậy được, lát nữa tôi đi.","Nakamura, bạn đang làm gì?","Bạn có thể lên tàu đổi bù vé giường nằm, có thể vẫn còn giường nằm."],"answer":3,"explanation":"“你可以上车补卧铺票，可能还有卧铺。” nghĩa là “Bạn có thể lên tàu đổi bù vé giường nằm, có thể vẫn còn giường nằm.”.","source":"Bài 29"},{"section":"Từ vựng","type":"meaning","prompt":"“趟” nghĩa là gì?","options":["cổ đại","lượng từ (chuyến...)","Noel, Lễ Giáng sinh","liên hoan"],"answer":1,"explanation":"“趟” đọc là tàng, nghĩa là “lượng từ (chuyến...)”.","source":"Bài 27"},{"section":"Bài khóa","type":"textbook","prompt":"Câu “不用准备。不过，也许会让你表演一个节目。” nghĩa là gì? Búyòng zhǔnbèi. Búguò, yěxǔ huì ràng nǐ biǎoyǎn yí ge jiémù.","options":["Tuyệt thật! Bạn nhất định thi đỗ.","Đúng vậy, tôi cũng thế. Tối nay đi thư giãn một chút nhé?","Cáp Nhĩ Tân à? Nơi đó mùa đông rất lạnh.","Không cần chuẩn bị. Nhưng có lẽ sẽ để bạn biểu diễn một tiết mục."],"answer":3,"explanation":"“不用准备。不过，也许会让你表演一个节目。” nghĩa là “Không cần chuẩn bị. Nhưng có lẽ sẽ để bạn biểu diễn một tiết mục.”.","source":"Bài 29"},{"section":"Ngữ pháp","type":"grammar","prompt":"Giải thích này thuộc điểm ngữ pháp nào? Dùng để nói một hành động hoặc sự việc sắp xảy ra.","options":["快 / 要 / 快要……了","只好","可能","会（2）"],"answer":0,"explanation":"Điểm ngữ pháp là “快 / 要 / 快要……了”.","source":"Bài 26"},{"section":"Pinyin","type":"pinyin","prompt":"Pinyin đúng của “努力” là gì?","options":["fāyīn","hèkǎ","tí","nǔlì"],"answer":3,"explanation":"Pinyin của “努力” là nǔlì.","source":"Bài 26"},{"section":"Điền từ","type":"fill","prompt":"我喜欢中国______历史。 Wǒ xǐhuan Zhōngguó gǔdài lìshǐ. Tôi thích lịch sử cổ đại Trung Quốc.","options":["地方","历史","票","古代"],"answer":3,"explanation":"Câu đầy đủ là “我喜欢中国古代历史。”.","source":"Bài 27"},{"section":"Ngữ pháp","type":"grammar","prompt":"Giải thích này thuộc điểm ngữ pháp nào? Dùng để nói làm sau, lát nữa làm, hoặc chờ đến thời điểm rồi làm.","options":["会（2）","动量词 遍","极了","再"],"answer":3,"explanation":"Điểm ngữ pháp là “再”.","source":"Bài 26"}];const letters=["A","B","C","D"];const state={};
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
function render(){const root=document.getElementById("quiz");let section="";root.innerHTML="";quizData.forEach((q,i)=>{if(q.section!==section){section=q.section;root.insertAdjacentHTML("beforeend",'<div class="section-title"><h2>'+esc(section)+'</h2><span></span></div>')}const opts=q.options.map((o,j)=>'<label class="option" id="q-'+i+'-o-'+j+'"><input type="radio" name="q-'+i+'" onchange="state['+i+']='+j+'"> <span><b>'+letters[j]+'.</b> '+esc(o)+'</span></label>').join("");root.insertAdjacentHTML("beforeend",'<article class="card" id="q-'+i+'"><div class="meta">Câu '+(i+1)+' · '+esc(q.type)+' · '+esc(q.source)+'</div><div class="exercise-q">'+esc(q.prompt)+'</div><div class="options">'+opts+'</div><div class="explain" id="q-'+i+'-ex"></div></article>')})}
function submitQuiz(){let correct=0;quizData.forEach((q,i)=>{const selected=state[i];q.options.forEach((_,j)=>{const el=document.getElementById("q-"+i+"-o-"+j);el.classList.remove("correct","wrong");if(j===q.answer)el.classList.add("correct");if(selected===j&&selected!==q.answer)el.classList.add("wrong")});if(selected===q.answer)correct++;const ex=document.getElementById("q-"+i+"-ex");ex.innerHTML='<b>'+(selected===q.answer?'Đúng':'Chưa đúng')+'.</b><br>Bạn chọn: '+esc(selected===undefined?'Chưa chọn':letters[selected]+'. '+q.options[selected])+'<br>Đáp án đúng: '+esc(letters[q.answer]+'. '+q.options[q.answer])+'<br>Giải thích: '+esc(q.explanation);ex.classList.add("show")});const pct=Math.round(correct/quizData.length*100);const r=document.getElementById("result");r.innerHTML='<b>'+correct+'/'+quizData.length+' câu đúng · '+pct+'%</b><br>Đáp án và giải thích đã hiện dưới từng câu.';r.classList.add("show");r.scrollIntoView({behavior:"smooth",block:"center"})}
function resetQuiz(){for(const k of Object.keys(state))delete state[k];document.querySelectorAll("input").forEach(i=>i.checked=false);document.querySelectorAll(".option").forEach(o=>o.classList.remove("correct","wrong"));document.querySelectorAll(".explain").forEach(e=>{e.classList.remove("show");e.innerHTML=""});document.getElementById("result").classList.remove("show");scrollTo({top:0,behavior:"smooth"})}
render();
</script>
</body>
