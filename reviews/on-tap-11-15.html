*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--ivory);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Be Vietnam Pro","Noto Sans SC",Arial,sans-serif;line-height:1.58}.wrap{width:min(1080px,calc(100vw - 28px));margin:0 auto}.hero{background:var(--burgundy);color:white;padding:32px 0 30px;border-bottom:8px solid var(--beige)}.eyebrow{color:#f1ddc5;font-weight:800;margin-bottom:10px}.hero h1{font-family:Georgia,"Noto Serif SC","Times New Roman",serif;font-size:clamp(2rem,7vw,4.2rem);line-height:1.1;margin:0}.hero .py{font-size:clamp(1.05rem,3vw,1.55rem);color:#f4e7d6;margin-top:12px}.hero .vi{font-size:clamp(1rem,3vw,1.35rem);color:#dcc8b5;margin-top:6px;font-weight:800}.topnav{position:sticky;top:0;background:rgba(252,250,246,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:5}.topnav .wrap{display:flex;gap:8px;overflow:auto;padding:10px 0}.topnav a{white-space:nowrap;text-decoration:none;background:white;border:1px solid var(--line);color:var(--burgundy);padding:8px 12px;border-radius:999px;font-weight:800;font-size:.92rem}main{padding:24px 0 52px}.section{margin:26px 0 18px}.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:16px;background:var(--burgundy);color:white;border-radius:10px;padding:13px 16px}.section-title h2{margin:0;font-size:1.28rem}.section-title span{color:#eadbcb;font-weight:800}.card{background:white;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgba(82,45,29,.08);padding:16px;margin:12px 0}.objective{border-left:5px solid var(--red)}.vocab-list{display:grid;gap:18px}.vocab{padding:0;overflow:hidden}.vocab-head{background:var(--burgundy);color:white;display:flex;justify-content:space-between;gap:14px;padding:12px 16px;font-weight:900}.vocab-body{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(300px,.9fr);gap:20px;padding:20px}.vocab .hanzi{font-family:"Noto Serif SC","Microsoft YaHei",serif;font-size:clamp(4.2rem,10vw,7rem);font-weight:900;color:var(--red);line-height:.96}.vocab .pinyin{font-size:clamp(1.35rem,3.2vw,2rem);margin-top:10px}.meaning{font-size:clamp(1.2rem,2.6vw,1.7rem);font-weight:900;color:var(--burgundy);margin-top:3px}.meta{color:var(--muted);font-size:.95rem}.usage{font-size:1.02rem;margin-top:10px;color:#403833}.examples{margin-top:18px;border-top:1px solid var(--line);padding-top:12px;display:grid;gap:12px}.ex{margin:0}.ex-cn{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:clamp(1.35rem,3vw,1.75rem);font-weight:900}.vocab-side{display:grid;gap:14px}.vocab-image{margin:0;min-height:210px;border:1.5px dashed #d8b07a;border-radius:10px;background:#fffaf1;display:grid;grid-template-rows:1fr auto;overflow:hidden}.vocab-image img{width:100%;height:100%;min-height:210px;object-fit:cover;display:block}.vocab-image figcaption{padding:8px 10px;background:white;color:var(--muted);font-size:.88rem;border-top:1px solid var(--line)}.vocab-image.panda-default{border-style:solid;background:#fffaf1}.vocab-image.panda-default img{object-fit:cover;object-position:center}.stroke-area{background:var(--light);border:1px solid var(--line);border-radius:10px;padding:12px}.stroke-title{font-family:"Noto Serif SC","Microsoft YaHei",serif;font-size:1.22rem;color:var(--burgundy);font-weight:900}.stroke-title span{font-family:inherit;color:var(--muted);font-size:1rem}.stroke-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px;margin-top:10px}.stroke-card{background:white;border:1px solid var(--line);border-radius:9px;min-height:122px;display:grid;grid-template-rows:1fr auto;align-items:center;justify-items:center;padding:8px}.stroke-card img{max-width:100%;height:82px;object-fit:contain}.stroke-card span{font-family:"Noto Serif SC","Microsoft YaHei",serif;color:var(--burgundy);font-weight:900}.stroke-card.missing{border-style:dashed;background:#fffaf1;align-items:stretch}.radical-note{width:100%;display:grid;gap:5 a(82,45,29,.08)}.exercise-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.teacher-badge{background:var(--light);border:1px solid var(--line);color:var(--burgundy);border-radius:999px;padding:6px 10px;font-size:.84rem;font-weight:900;white-space:nowrap}.exercise-stage{display:flex;align-items:center;gap:8px;margin-top:14px;color:var(--burgundy)}.exercise-stage span{width:25px;height:25px;border-radius:50%;background:var(--burgundy);color:white;display:grid;place-items:center;font-weight:900}.exercise-stage.answer-stage{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}.exercise-title{font-family:"Noto Serif SC","Microsoft YaHei",serif;color:var(--burgundy);font-size:1.35rem;font-weight:900}.exercise-instruction{font-weight:800;margin-top:6px}.exercise-q{font-weight:900;font-size:1.16rem;white-space:pre-line;background:var(--ivory);border:1px solid var(--line);border-radius:9px;padding:12px;margin-top:12px}.exercise-q.situation{font-weight:700;color:#403833}.keyword-bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.keyword-bank span{background:#fffaf1;border:1px solid var(--line);border-radius:999px;padding:6px 10px;color:var(--burgundy);font-weight:900}.write-lines{display:grid;gap:12px;margin-top:14px}.write-lines span{display:block;height:42px;border-bottom:2px solid var(--line)}.answer-panel{margin-top:10px;border:1px solid var(--line);border-radius:9px;background:#fffaf1;padding:10px}.answer-panel summary{cursor:pointer;color:var(--burgundy);font-weight:900}.answer-main{font-size:1.05rem;margin-top:8px;color:#0f5528}.answer-cn{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:1.18rem;font-weight:900;margin-top:8px}.answer-explain{margin-top:8px;border-top:1px solid var(--line);padding-top:8px;color:#403833}.options{display:grid;gap:8px;margin-top:10px}.option{display:grid;grid-template-columns:32px 1fr;gap:8px;align-items:start;width:100%;border:1px solid var(--line);background:var(--light);border-radius:8px;padding:10px 12px;text-align:left;font-size:1rem}.option.teacher-answer.show-answer{background:var(--okbg);border-color:var(--ok);color:#0f5528;font-weight:900}.option.correct{background:var(--okbg);border-color:var(--ok);color:#0f5528;font-weight:900}.option.wrong{background:var(--badbg);border-color:var(--bad);color:#8f1919}.explain{display:none;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}.explain.show{display:block}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.btn{border:0;border-radius:8px;background:var(--red);color:white;padding:12px 16px;font-weight:900}.btn.secondary{background:var(--beige);color:var(--burgundy)}.result{display:none;background:var(--burgundy);color:white;border-radius:10px;padding:16px;margin:18px 0}.result.show{display:block}.index-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.lesson-link{display:block;text-decoration:none;color:var(--text);background:white;border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:0 10px 28px rgba(82,45,29,.08)}.lesson-link b{color:var(--burgundy);font-size:1.1rem}.review-link{border-color:#d8b07a;background:#fffaf1}@media(max-width:860px){.vocab-body{grid-template-columns:1fr}.vocab-side{order:-1}.vocab .hanzi{font-size:clamp(4rem,18vw,6rem)}.vocab-image{min-height:180px}.vocab-image img{min-height:180px}.grammar-detail,.grammar-examples{grid-template-columns:1fr}}@media(max-width:760px){.index-grid{grid-template-columns:1fr}.dialogue .turn{grid-template-columns:36px 1fr}.hero{padding:26px 0}.section-title{display:block}.topnav a{font-size:.86rem}.card{padding:14px}.vocab{padding:0}.vocab-body{padding:14px}.turn-cn{font-size:1.16rem}.stroke-grid{grid-template-columns:repeat(auto-fit,minmax(128px,1fr))}.practice-tools{top:48px;justify-content:stretch}.practice-tools button{flex:1}.exercise-top{display:block}.teacher-badge{display:inline-block;margin-top:8px}}

<script>
const quizData=[{"section":"Pinyin","type":"pinyin","prompt":"Pinyin đúng của “说” là gì?","options":["chángcháng","zuótiān","dōngtiān","shuō"],"answer":3,"explanation":"Pinyin của “说” là shuō.","source":"Bài 15"},{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “cùng, cùng nhau”?","options":["贵","所以","女","一起"],"answer":3,"explanation":"Đáp án đúng là “一起”, đọc là yīqǐ.","source":"Bài 13"},{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “bận”?","options":["忙","号","差不多","礼物"],"answer":0,"explanation":"Đáp án đúng là “忙”, đọc là máng.","source":"Bài 12"},{"section":"Từ vựng","type":"meaning","prompt":"“雪” nghĩa là gì?","options":["tuyết","cũ","a lô","bài hát"],"answer":0,"explanation":"“雪” đọc là xuě, nghĩa là “tuyết”.","source":"Bài 11"},{"section":"Từ vựng","type":"meaning","prompt":"“好看” nghĩa là gì?","options":["gió","quà tặng","đẹp","nóng"],"answer":2,"explanation":"“好看” đọc là hǎokàn, nghĩa là “đẹp”.","source":"Bài 14"},{"section":"Ngữ pháp","type":"grammar","prompt":"Giải thích này thuộc điểm ngữ pháp nào? A và B thường là tính từ trái nghĩa.","options":["连动句","不A不B","每……都……","挺 + 形容词"],"answer":1,"explanation":"Điểm ngữ pháp là “不A不B”.","source":"Bài 15"},{"section":"Ngữ pháp","type":"grammar","prompt":"Giải thích này thuộc điểm ngữ pháp nào? Dùng để nói mỗi lần/mỗi người đều như nhau.","options":["先……然后……","连动句","挺 + 形容词","每……都……"],"answer":3,"explanation":"Điểm ngữ pháp là “每……都……”.","source":"Bài 12"},{"section":"Điền từ","type":"fill","prompt":"他______在家。 Tā yīqǐ zài jiā. Anh ấy cùng, cùng nhau ở nhà.","options":["歌","衣服","绿","一起"],"answer":3,"explanation":"Câu đầy đủ là “他一起在家。”.","source":"Bài 13"},{"section":"Bài khóa","type":"textbook","prompt":"Câu “我喜欢夏天，我喜欢游泳。老师，您呢？” nghĩa là gì? Wǒ xǐhuan xiàtiān, wǒ xǐhuan yóuyǒng. Lǎoshī, nín ne?","options":["Bạn đang làm gì vậy?","Ngày mai là trời nắng.","Đúng vậy. Mỗi ngày tôi đều có nhiều bài tập.","Em thích mùa hè, em thích bơi. Thầy thì sao ạ?"],"answer":3,"explanation":"“我喜欢夏天，我喜欢游泳。老师，您呢？” nghĩa là “Em thích mùa hè, em thích bơi. Thầy thì sao ạ?”.","source":"Bài 11"},{"section":"Bài khóa","type":"textbook","prompt":"Câu “明天是晴天。” nghĩa là gì? Míngtiān shì qíngtiān.","options":["Đồ ở đó có đắt không?","Trung tâm mua sắm mở cửa lúc 9 giờ, chúng ta đi lúc 10 giờ nhé.","Không tệ, khá đẹp, mua nó đi.","Ngày mai là trời nắng."],"answer":3,"explanation":"“明天是晴天。” nghĩa là “Ngày mai là trời nắng.”.","source":"Bài 11"},{"section":"Pinyin","type":"pinyin","prompt":"Pinyin đúng của “以后” là gì?","options":["zài","qiūtiān","guì","yǐhòu"],"answer":3,"explanation":"Pinyin của “以后” là yǐhòu.","source":"Bài 15"},{"section":"Điền từ","type":"fill","prompt":"今天不太______。 Jīntiān bú tài lěng. Hôm nay không lạnh lắm.","options":["件","说","好看","冷"],"answer":3,"explanation":"Câu đầy đủ là “今天不太冷。”.","source":"Bài 11"},{"section":"Bài khóa","type":"textbook","prompt":"Câu “我正打算买衣服呢，明天和你一起去，好不好？” nghĩa là gì? Wǒ zhèng dǎsuàn mǎi yīfu ne, míngtiān hé nǐ yīqǐ qù, hǎo bu hǎo?","options":["Tôi đang định mua quần áo đây, ngày mai đi cùng bạn nhé?","Em thích mùa hè, em thích bơi. Thầy thì sao ạ?","Ngày mai thì sao?","Mùa thu Bắc Kinh không lạnh không nóng, rất dễ chịu, là mùa tốt nhất."],"answer":0,"explanation":"“我正打算买衣服呢，明天和你一起去，好不好？” nghĩa là “Tôi đang định mua quần áo đây, ngày mai đi cùng bạn nhé?”.","source":"Bài 13"},{"section":"Từ vựng","type":"meaning","prompt":"“有点儿” nghĩa là gì?","options":["hát","bó, lượng từ của hoa","mới","hơi chút"],"answer":3,"explanation":"“有点儿” đọc là yǒudiǎnr, nghĩa là “hơi chút”.","source":"Bài 14"},{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “thẫm, đậm”?","options":["干","喜欢","蓝","深"],"answer":3,"explanation":"Đáp án đúng là “深”, đọc là shēn.","source":"Bài 14"},{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “bó, lượng từ của hoa”?","options":["蓝","那么","舒服","束"],"answer":3,"explanation":"Đáp án đúng là “束”, đọc là shù.","source":"Bài 15"},{"section":"Điền từ","type":"fill","prompt":"______很重要。 jìjié hěn zhòngyào. mùa rất quan trọng.","options":["丢","购物中心","季节","咱们"],"answer":2,"explanation":"Câu đầy đủ là “季节很重要。”.","source":"Bài 11"},{"section":"Ngữ pháp","type":"grammar","prompt":"Giải thích này thuộc điểm ngữ pháp nào? 每 đi với 都 để nói tính phổ biến.","options":["咱们 / 我们","可 + V","选择问句：是……还是……","每……都……"],"answer":3,"explanation":"Điểm ngữ pháp là “每……都……”.","source":"Bài 15"},{"section":"Điền từ","type":"fill","prompt":"我想______一下。 Wǒ xiǎng xǐhuan yíxià. Tôi muốn thích, yêu thích một chút/thử một chút.","options":["正在","商店","喂","喜欢"],"answer":3,"explanation":"Câu đầy đủ là “我想喜欢一下。”.","source":"Bài 11"},{"section":"Ngữ pháp","type":"grammar","prompt":"Giải thích này thuộc điểm ngữ pháp nào? Dùng khi một chủ ngữ thực hiện các hành động liên tiếp.","options":["星期的表达法","挺 + 形容词","（正在 / 在）……呢","连动句"],"answer":3,"explanation":"Điểm ngữ pháp là “连动句”.","source":"Bài 15"},{"section":"Ngữ pháp","type":"grammar","prompt":"Giải thích này thuộc điểm ngữ pháp nào? Cấu trúc này thường dùng cho sự việc không mong muốn; 一 có thể lược bỏ.","options":["有（一）点儿","从……到……","形容词谓语","每……都……"],"answer":0,"explanation":"Điểm ngữ pháp là “有（一）点儿”.","source":"Bài 14"},{"section":"Từ vựng","type":"meaning","prompt":"“绿” nghĩa là gì?","options":["màu xanh lục","nó, vật ấy","rẻ","mùa hè"],"answer":0,"explanation":"“绿” đọc là lǜ, nghĩa là “màu xanh lục”.","source":"Bài 14"},{"section":"Điền từ","type":"fill","prompt":"今天很______。 Jīntiān hěn búcuò. Hôm nay rất tốt, không xấu, không tồi.","options":["不错","春天","喜欢","雪"],"answer":0,"explanation":"Câu đầy đủ là “今天很不错。”.","source":"Bài 13"},{"section":"Ngữ pháp","type":"grammar","prompt":"Giải thích này thuộc điểm ngữ pháp nào? \"咱们\" thường bao gồm cả người nói và người nghe.,\"我们\" có thể bao gồm cả người nói và người nghe, cũng có thể không bao gồm người nghe.,Chú ý: \"咱们\" luôn bao hàm người đang nói chuyện với mình, còn \"我们\" thì chưa chắc.","options":["形容词谓语","每……都……","连动句","\"咱们\"和\"我们\""],"answer":3,"explanation":"Điểm ngữ pháp là “\"咱们\"和\"我们\"”.","source":"Bài 13"},{"section":"Bài khóa","type":"textbook","prompt":"Câu “玛丽，这是你的自行车吗？” nghĩa là gì? Mǎlì, zhè shì nǐ de zìxíngchē ma?","options":["Chiếc màu vàng kia thì sao?","Thế thì tặng một bó hoa đi, cô gái nào cũng thích hoa.","Đúng, tôi mua một chiếc cũ, xe cũ tương đối rẻ, cũng không dễ mất.","Mary, đây là xe đạp của bạn à?"],"answer":3,"explanation":"“玛丽，这是你的自行车吗？” nghĩa là “Mary, đây là xe đạp của bạn à?”.","source":"Bài 14"},{"section":"Pinyin","type":"pinyin","prompt":"Pinyin đúng của “冬天” là gì?","options":["fēng","suǒyǐ","dōngtiān","tèbié"],"answer":2,"explanation":"Pinyin của “冬天” là dōngtiān.","source":"Bài 11"},{"section":"Bài khóa","type":"textbook","prompt":"Câu “明天呢？” nghĩa là gì? Míngtiān ne?","options":["Ngày mai thì sao?","Bạn định tặng cho ai? Nam hay nữ?","Không tốt lắm, có gió, chiều còn có mưa.","Đầu tiên tôi đi ngân hàng đổi tiền, sau đó đi cửa hàng mua đồ."],"answer":0,"explanation":"“明天呢？” nghĩa là “Ngày mai thì sao?”.","source":"Bài 11"},{"section":"Từ vựng","type":"meaning","prompt":"“喝” nghĩa là gì?","options":["bận, bận rộn","luôn, liên tục","hôm qua","uống"],"answer":3,"explanation":"“喝” đọc là hē, nghĩa là “uống”.","source":"Bài 12"},{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “hát”?","options":["漂亮","准备","说","唱"],"answer":3,"explanation":"Đáp án đúng là “唱”, đọc là chàng.","source":"Bài 12"},{"section":"Điền từ","type":"fill","prompt":"这是______。 Zhè shì yínháng. Đây là ngân hàng.","options":["差不多","天气","商店","银行"],"answer":3,"explanation":"Câu đầy đủ là “这是银行。”.","source":"Bài 13"},{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “đẹp, xinh đẹp”?","options":["一起","漂亮","深","束"],"answer":1,"explanation":"Đáp án đúng là “漂亮”, đọc là piàoliang.","source":"Bài 14"},{"section":"Ngữ pháp","type":"grammar","prompt":"Giải thích này thuộc điểm ngữ pháp nào? Dùng để sắp xếp hai hành động theo thời gian.","options":["怎么样","可 + V","“的”字词组","先……然后……"],"answer":3,"explanation":"Điểm ngữ pháp là “先……然后……”.","source":"Bài 15"},{"section":"Từ vựng","type":"meaning","prompt":"“说” nghĩa là gì?","options":["nói","nóng","luôn, liên tục","uống"],"answer":0,"explanation":"“说” đọc là shuō, nghĩa là “nói”.","source":"Bài 15"},{"section":"Từ vựng","type":"meaning","prompt":"“在” nghĩa là gì?","options":["đang","bài tập","nhiều","xuống, rơi xuống"],"answer":0,"explanation":"“在” đọc là zài, nghĩa là “đang”.","source":"Bài 12"},{"section":"Từ vựng","type":"meaning","prompt":"“新” nghĩa là gì?","options":["xuống, rơi xuống","hơi chút","cửa hàng, shop","mới"],"answer":3,"explanation":"“新” đọc là xīn, nghĩa là “mới”.","source":"Bài 14"},{"section":"Điền từ","type":"fill","prompt":"请______一下。 Qǐng sòng yíxià. Xin hãy tặng một chút.","options":["挺","便宜","咱们","送"],"answer":3,"explanation":"Câu đầy đủ là “请送一下。”.","source":"Bài 15"},{"section":"Bài khóa","type":"textbook","prompt":"Câu “北京的秋天不冷不热，很舒服，是最好的季节。” nghĩa là gì? Běijīng de qiūtiān bù lěng bú rè, hěn shūfu, shì zuì hǎo de jìjié.","options":["Có, có màu đen, xanh lam, còn có xám, vàng. Bạn thích màu gì?","Sô-cô-la hơi ngọt, cô ấy không thích đồ ngọt.","Được thôi!","Mùa thu Bắc Kinh không lạnh không nóng, rất dễ chịu, là mùa tốt nhất."],"answer":3,"explanation":"“北京的秋天不冷不热，很舒服，是最好的季节。” nghĩa là “Mùa thu Bắc Kinh không lạnh không nóng, rất dễ chịu, là mùa tốt nhất.”.","source":"Bài 11"},{"section":"Từ vựng","type":"meaning","prompt":"“送” nghĩa là gì?","options":["chuẩn bị","nói","cà phê","tặng"],"answer":3,"explanation":"“送” đọc là sòng, nghĩa là “tặng”.","source":"Bài 15"},{"section":"Pinyin","type":"pinyin","prompt":"Pinyin đúng của “咖啡” là gì?","options":["wéi","fēng","shù","kāfēi"],"answer":3,"explanation":"Pinyin của “咖啡” là kāfēi.","source":"Bài 12"},{"section":"Ngữ pháp","type":"grammar","prompt":"Giải thích này thuộc điểm ngữ pháp nào? Thường dùng với 的.","options":["正在 / 在……呢","连动句","先……然后……","挺 + 形容词"],"answer":3,"explanation":"Điểm ngữ pháp là “挺 + 形容词”.","source":"Bài 15"},{"section":"Pinyin","type":"pinyin","prompt":"Pinyin đúng của “丢” là gì?","options":["zìjǐ","zuótiān","shēn","diū"],"answer":3,"explanation":"Pinyin của “丢” là diū.","source":"Bài 14"},{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “bình thường, tạm được”?","options":["以后","巧克力","最","还可以"],"answer":3,"explanation":"Đáp án đúng là “还可以”, đọc là hái kěyǐ.","source":"Bài 13"},{"section":"Pinyin","type":"pinyin","prompt":"Pinyin đúng của “黄” là gì?","options":["xiān","zāng","hào","huáng"],"answer":3,"explanation":"Pinyin của “黄” là huáng.","source":"Bài 14"},{"section":"Pinyin","type":"pinyin","prompt":"Pinyin đúng của “正在” là gì?","options":["kāfēi","diū","huáng","zhèngzài"],"answer":3,"explanation":"Pinyin của “正在” là zhèngzài.","source":"Bài 12"},{"section":"Từ vựng","type":"meaning","prompt":"“下” nghĩa là gì?","options":["buổi sáng","làm","đẹp","xuống, rơi xuống"],"answer":3,"explanation":"“下” đọc là xià, nghĩa là “xuống, rơi xuống”.","source":"Bài 11"},{"section":"Từ vựng","type":"meaning","prompt":"“生日” nghĩa là gì?","options":["luôn, liên tục","sau, sau khi","sinh nhật","màu xanh lục"],"answer":2,"explanation":"“生日” đọc là shēngrì, nghĩa là “sinh nhật”.","source":"Bài 15"},{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “uống”?","options":["先","黄","游泳","喝"],"answer":3,"explanation":"Đáp án đúng là “喝”, đọc là hē.","source":"Bài 12"},{"section":"Pinyin","type":"pinyin","prompt":"Pinyin đúng của “银行” là gì?","options":["bǐjiào","xiàtiān","yǔ","yínháng"],"answer":3,"explanation":"Pinyin của “银行” là yínháng.","source":"Bài 13"},{"section":"Từ vựng","type":"meaning","prompt":"“商店” nghĩa là gì?","options":["bơi lội","đặc biệt","quần áo","cửa hàng, shop"],"answer":3,"explanation":"“商店” đọc là shāngdiàn, nghĩa là “cửa hàng, shop”.","source":"Bài 13"},{"section":"Điền từ","type":"fill","prompt":"这是______。 Zhè shì dàngāo. Đây là bánh ngọt.","options":["差不多","唱","一直","蛋糕"],"answer":3,"explanation":"Câu đầy đủ là “这是蛋糕。”.","source":"Bài 15"}];const letters=["A","B","C","D"];const state={};
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
function render(){const root=document.getElementById("quiz");let section="";root.innerHTML="";quizData.forEach((q,i)=>{if(q.section!==section){section=q.section;root.insertAdjacentHTML("beforeend",'<div class="section-title"><h2>'+esc(section)+'</h2><span></span></div>')}const opts=q.options.map((o,j)=>'<label class="option" id="q-'+i+'-o-'+j+'"><input type="radio" name="q-'+i+'" onchange="state['+i+']='+j+'"> <span><b>'+letters[j]+'.</b> '+esc(o)+'</span></label>').join("");root.insertAdjacentHTML("beforeend",'<article class="card" id="q-'+i+'"><div class="meta">Câu '+(i+1)+' · '+esc(q.type)+' · '+esc(q.source)+'</div><div class="exercise-q">'+esc(q.prompt)+'</div><div class="options">'+opts+'</div><div class="explain" id="q-'+i+'-ex"></div></article>')})}
function submitQuiz(){let correct=0;quizData.forEach((q,i)=>{const selected=state[i];q.options.forEach((_,j)=>{const el=document.getElementById("q-"+i+"-o-"+j);el.classList.remove("correct","wrong");if(j===q.answer)el.classList.add("correct");if(selected===j&&selected!==q.answer)el.classList.add("wrong")});if(selected===q.answer)correct++;const ex=document.getElementById("q-"+i+"-ex");ex.innerHTML='<b>'+(selected===q.answer?'Đúng':'Chưa đúng')+'.</b><br>Bạn chọn: '+esc(selected===undefined?'Chưa chọn':letters[selected]+'. '+q.options[selected])+'<br>Đáp án đúng: '+esc(letters[q.answer]+'. '+q.options[q.answer])+'<br>Giải thích: '+esc(q.explanation);ex.classList.add("show")});const pct=Math.round(correct/quizData.length*100);const r=document.getElementById("result");r.innerHTML='<b>'+correct+'/'+quizData.length+' câu đúng · '+pct+'%</b><br>Đáp án và giải thích đã hiện dưới từng câu.';r.classList.add("show");r.scrollIntoView({behavior:"smooth",block:"center"})}
function resetQuiz(){for(const k of Object.keys(state))delete state[k];document.querySelectorAll("input").forEach(i=>i.checked=false);document.querySelectorAll(".option").forEach(o=>o.classList.remove("correct","wrong"));document.querySelectorAll(".explain").forEach(e=>{e.classList.remove("show");e.innerHTML=""});document.getElementById("result").classList.remove("show");scrollTo({top:0,behavior:"smooth"})}
render();
</script>
