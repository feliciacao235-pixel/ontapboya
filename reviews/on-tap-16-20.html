px}.radical-char{font-family:"Noto Serif SC","Microsoft YaHei",serif;font-size:2.3rem;line-height:1;color:var(--red);font-weight:900;text-align:center}.radical-line{display:grid;grid-template-columns:32px 1fr;gap:6px;align-items:start;font-size:.78rem;color:#5f5147;line-height:1.25}.radical-line b{font-family:"Noto Serif SC","Microsoft YaHei",serif;color:var(--burgundy);font-size:1.05rem}.stroke-note{color:var(--muted)}.grammar-title{font-family:"Noto Serif SC","Microsoft YaHei",serif;color:var(--burgundy);font-size:1.85rem;font-weight:900}.grammar-subtitle{font-size:1.05rem;color:var(--muted);font-weight:800;margin-top:4px}.grammar-detail{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}.grammar-block{background:var(--ivory);border:1px solid var(--line);border-radius:9px;padding:12px}.grammar-block b{color:var(--burgundy)}.grammar-block p{margin:.35rem 0 0}.grammar-block.warning{background:#fff4f2}.grammar-block.remember{background:#fffaf1}.formula{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.formula span{background:var(--light);border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--burgundy);font-weight:900}.formula span.hot{background:#fff1ef;border-color:#e8aaa5;color:var(--red)}.grammar-examples{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}.dialogue .turn{display:grid;grid-template-columns:44px 1fr;gap:12px;border-top:1px solid var(--line);padding:12px 0}.speaker{width:38px;height:38px;border-radius:50%;background:var(--burgundy);color:white;display:grid;place-items:center;font-weight:900}.turn-cn{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:1.28rem;font-weight:900}.practice-tools{position:sticky;top:54px;z-index:4;display:flex;gap:10px;justify-content:flex-end;margin:12px 0}.practice-tools button{border:1px solid var(--line);border-radius:999px;background:white;color:var(--burgundy);font-weight:900;padding:9px 13px;box-shadow:0 8px 18px rgba(82,45,29,.08)}.exercise-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.teacher-badge{background:var(--light);border:1px solid var(--line);color:var(--burgundy);border-radius:999px;padding:6px 10px;font-size:.84rem;font-weight:900;white-space:nowrap}.exercise-stage{display:flex;align-items:center;gap:8px;margin-top:14px;color:var(--burgundy)}.exercise-stage span{width:25px;height:25px;border-radius:50%;background:var(--burgundy);color:white;display:grid;place-items:center;font-weight:900}.exercise-stage.answer-stage{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}.exercise-title{font-family:"Noto Serif SC","Microsoft YaHei",serif;color:var(--burgundy);font-size:1.35rem;font-weight:900}.exercise-instruction{font-weight:800;margin-top:6px}.exercise-q{font-weight:900;font-size:1.16rem;white-space:pre-line;background:var(--ivory);border:1px solid var(--line);border-radius:9px;padding:12px;margin-top:12px}.exercise-q.situation{font-weight:700;color:#403833}.keyword-bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.keyword-bank span{background:#fffaf1;border:1px solid var(--line);border-radius:999px;padding:6px 10px;color:var(--burgundy);font-weight:900}.write-lines{display:grid;gap:12px;margin-top:14px}.write-lines span{display:block;height:42px;border-bottom:2px solid var(--line)}.answer-panel{margin-top:10px;border:1px solid var(--line);border-radius:9px;background:#fffaf1;padding:10px}.answer-panel summary{cursor:pointer;color:var(--burgundy);font-weight:900}.answer-main{font-size:1.05rem;margin-top:8px;color:#0f5528}.answer-cn{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:1.18rem;font-weight:900;margin-top:8px}.answer-explain{margin-top:8px;border-top:1px solid var(--line);padding-top:8px;color:#403833}.options{display:grid;gap:8px;margin-top:10px}.option{display:grid;grid-template-columns:32px 1fr;gap:8px;align-items:start;width:100%;border:1px solid var(--line);background:var(--light);border-radius:8px;padding:10px 12px;text-align:left;font-size:1rem}.option.teacher-answer.show-answer{background:var(--okbg);border-color:var(--ok);color:#0f5528;font-weight:900}.option.correct{background:var(--okbg);border-color:var(--ok);color:#0f5528;font-weight:900}.option.wrong{background:var(--badbg);border-color:var(--bad);color:#8f1919}.explain{display:none;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}.explain.show{display:block}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.btn{border:0;border-radius:8px;background:var(--red);color:white;padding:12px 16px;font-weight:900}.btn.secondary{background:var(--beige);color:var(--burgundy)}.result{display:none;background:var(--burgundy);color:white;border-radius:10px;padding:16px;margin:18px 0}.result.show{display:block}.index-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.lesson-link{display:block;text-decoration:none;color:var(--text);background:white;border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:0 10px 28px rgba(82,45,29,.08)}.lesson-link b{color:var(--burgundy);font-size:1.1rem}.review-link{border-color:#d8b07a;background:#fffaf1}@media(max-width:860px){.vocab-body{grid-template-columns:1fr}.vocab-side{order:-1}.vocab .hanzi{font-size:clamp(4rem,18vw,6rem)}.vocab-image{min-height:180px}.vocab-image img{min-height:180px}.grammar-detail,.grammar-examples{grid-template-columns:1fr}}@media(max-width:760px){.index-grid{grid-template-columns:1fr}.dialogue .turn{grid-template-columns:36px 1fr}.hero{padding:26px 0}.section-title{display:block}.topnav a{font-size:.86rem}.card{padding:14px}.vocab{padding:0}.vocab-body{padding:14px}.turn-cn{font-size:1.16rem}.stroke-grid{grid-template-columns:repeat(auto-fit,minmax(128px,1fr))}.practice-tools{top:48px;justify-content:stretch}.practice-tools button{flex:1}.exercise-top{display:block}.teacher-badge{display:inline-block;margin-top:8px}}

<script>
const quizData=[{"section":"Từ vựng","type":"meaning","prompt":"“米饭” nghĩa là gì?","options":["tùy tiện","lớn, lớn tuổi","cơm","khiêu vũ, nhảy"],"answer":2,"explanation":"“米饭” đọc là mǐfàn, nghĩa là “cơm”.","source":"Bài 18"},{"section":"Từ vựng","type":"meaning","prompt":"“洗” nghĩa là gì?","options":["giặt, rửa","ít, thiếu","ái chà, ôi chao","thú vị, có ý nghĩa"],"answer":0,"explanation":"“洗” đọc là xǐ, nghĩa là “giặt, rửa”.","source":"Bài 16"},{"section":"Từ vựng","type":"meaning","prompt":"“药” nghĩa là gì?","options":["nằm mơ","đông đúc","thuốc","ti vi, vô tuyến"],"answer":2,"explanation":"“药” đọc là yào, nghĩa là “thuốc”.","source":"Bài 20"},{"section":"Bài khóa","type":"textbook","prompt":"Câu “看看书，听听音乐，睡睡觉，做做梦……” nghĩa là gì? Kànkan shū, tīngting yīnyuè, shuìshui jiào, zuòzuo mèng...","options":["Xem sách, nghe nhạc, ngủ, mơ...","Cuối tuần này bạn làm gì?","Người miền Bắc thích, người miền Nam thích cơm.","Không thoải mái. Một mình ăn, một mình ngủ, một mình chơi, rất buồn chán."],"answer":0,"explanation":"“看看书，听听音乐，睡睡觉，做做梦……” nghĩa là “Xem sách, nghe nhạc, ngủ, mơ...”.","source":"Bài 20"},{"section":"Từ vựng","type":"meaning","prompt":"“才” nghĩa là gì?","options":["mới, mới chịu","mì sợi","muốn","dài"],"answer":0,"explanation":"“才” đọc là cái, nghĩa là “mới, mới chịu”.","source":"Bài 19"},{"section":"Ngữ pháp","type":"grammar","prompt":"Giải thích này thuộc điểm ngữ pháp nào? 就 thường gợi ý sớm/ít; 才 thường gợi ý muộn/ít hơn mong đợi.","options":["“就”和“才”","会（1）","动词重叠","年龄表达法"],"answer":0,"explanation":"Điểm ngữ pháp là ““就”和“才””.","source":"Bài 20"},{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “đừng”?","options":["别","改","可以","无聊"],"answer":0,"explanation":"Đáp án đúng là “别”, đọc là bié.","source":"Bài 20"},{"section":"Pinyin","type":"pinyin","prompt":"Pinyin đúng của “音乐会” là gì?","options":["xiànr","yīnyuèhuì","dài","tiào wǔ"],"answer":1,"explanation":"Pinyin của “音乐会” là yīnyuèhuì.","source":"Bài 16"},{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “thức ăn làm từ bột mì”?","options":["面食","客人","死","打车"],"answer":0,"explanation":"Đáp án đúng là “面食”, đọc là miànshí.","source":"Bài 18"},{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “mùi vị”?","options":["味道","生词","工作","逛"],"answer":0,"explanation":"Đáp án đúng là “味道”, đọc là wèidao.","source":"Bài 18"},{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “người khách”?","options":["重要","医院","客人","累"],"answer":2,"explanation":"Đáp án đúng là “客人”, đọc là kèrén.","source":"Bài 18"},{"section":"Bài khóa","type":"textbook","prompt":"Câu “看起来，你很喜欢周末。” nghĩa là gì? Kànqilai, nǐ hěn xǐhuan zhōumò.","options":["Đây là quà tặng thầy/cô.","Xem ra bạn rất thích cuối tuần.","Mời vào, mời vào!","Thưa thầy/cô, nhà thầy/cô thật sạch sẽ!"],"answer":1,"explanation":"“看起来，你很喜欢周末。” nghĩa là “Xem ra bạn rất thích cuối tuần.”.","source":"Bài 16"},{"section":"Pinyin","type":"pinyin","prompt":"Pinyin đúng của “袋” là gì?","options":["dài","xiǎng","diǎnzhōng","tóngyì"],"answer":0,"explanation":"Pinyin của “袋” là dài.","source":"Bài 18"},{"section":"Ngữ pháp","type":"grammar","prompt":"Giải thích này thuộc điểm ngữ pháp nào? Dùng khi tình trạng đã thay đổi so với trước.","options":["列举","地点状语","了（1）","反问句（1）"],"answer":2,"explanation":"Điểm ngữ pháp là “了（1）”.","source":"Bài 19"},{"section":"Bài khóa","type":"textbook","prompt":"Câu “好啊，不过你得问问医生行不行。如果医生同意的话，咱们就换。对了，你中午想吃什么？米饭、炒菜、面条儿，还是饺子？” nghĩa là gì? Hǎo a, búguò nǐ děi wènwen yīshēng xíng bu xíng. Rúguǒ yīshēng tóngyì de huà, zánmen jiù huàn. Duì le, nǐ zhōngwǔ xiǎng chī shénme? Mǐfàn, chǎo cài, miàntiáor, háishi jiǎozi?","options":["Mary, thế nào rồi? Bây giờ đỡ hơn chút nào chưa?","Xem ra bạn rất thích cuối tuần.","Được, nhưng bạn phải hỏi bác sĩ có được không. Nếu bác sĩ đồng ý thì chúng ta đổi. À đúng rồi, trưa bạn muốn ăn gì? Cơm, món xào, mì hay sủi cảo?","Đừng khách sáo. Không đi học, cũng không có bài tập, khá thoải mái nhỉ?"],"answer":2,"explanation":"“好啊，不过你得问问医生行不行。如果医生同意的话，咱们就换。对了，你中午想吃什么？米饭、炒菜、面条儿，还是饺子？” nghĩa là “Được, nhưng bạn phải hỏi bác sĩ có được không. Nếu bác sĩ đồng ý thì chúng ta đổi. À đúng rồi, trưa bạn muốn ăn gì? Cơm, món xào, mì hay sủi cảo?”.","source":"Bài 20"},{"section":"Pinyin","type":"pinyin","prompt":"Pinyin đúng của “有意思” là gì?","options":["tóngyì","yǒu yìsi","duì...lái shuō","shàng"],"answer":1,"explanation":"Pinyin của “有意思” là yǒu yìsi.","source":"Bài 18"},{"section":"Ngữ pháp","type":"grammar","prompt":"Giải thích này thuộc điểm ngữ pháp nào? Có thể dùng “如果……的话” hoặc chỉ dùng “如果”.","options":["如果……的话，就……","如果……（的话），就……","了（1）","“就”和“才”"],"answer":0,"explanation":"Điểm ngữ pháp là “如果……的话，就……”.","source":"Bài 18"},{"section":"Ngữ pháp","type":"grammar","prompt":"Giải thích này thuộc điểm ngữ pháp nào? Dùng trước cụm thời gian hoặc địa điểm làm trạng ngữ.","options":["就 / 才","在","动词重叠","就是"],"answer":1,"explanation":"Điểm ngữ pháp là “在”.","source":"Bài 19"},{"section":"Ngữ pháp","type":"grammar","prompt":"Giải thích này thuộc điểm ngữ pháp nào? Dùng khi người nói đã có nhận định rõ và muốn nhấn mạnh.","options":["反问句（1）","会（1）","了（1）","adj. + 死了"],"answer":0,"explanation":"Điểm ngữ pháp là “反问句（1）”.","source":"Bài 18"},{"section":"Điền từ","type":"fill","prompt":"______说话。 Bié shuōhuà. Đừng nói chuyện.","options":["果汁","别","饿","岁"],"answer":1,"explanation":"Câu đầy đủ là “别说话。”.","source":"Bài 20"},{"section":"Điền từ","type":"fill","prompt":"______对身体好。 Zǎo shuì zǎo qǐ duì shēntǐ hǎo. Ngủ sớm dậy sớm tốt cho sức khỏe.","options":["的话","逛","早睡早起","看"],"answer":2,"explanation":"Câu đầy đủ là “早睡早起对身体好。”.","source":"Bài 19"},{"section":"Điền từ","type":"fill","prompt":"今天很______。 Jīntiān hěn è. Hôm nay rất đói.","options":["吃","饿","问","刚"],"answer":1,"explanation":"Câu đầy đủ là “今天很饿。”.","source":"Bài 17"},{"section":"Pinyin","type":"pinyin","prompt":"Pinyin đúng của “馅儿” là gì?","options":["kànqilai","la","xiànr","nián"],"answer":2,"explanation":"Pinyin của “馅儿” là xiànr.","source":"Bài 18"},{"section":"Từ vựng","type":"meaning","prompt":"“可以” nghĩa là gì?","options":["có thể","thử","tàu điện ngầm","ngày lễ, ngày hội"],"answer":0,"explanation":"“可以” đọc là kěyǐ, nghĩa là “có thể”.","source":"Bài 16"},{"section":"Điền từ","type":"fill","prompt":"请______一下。 Qǐng zuò yíxià. Xin hãy ngồi một chút.","options":["坐","多","袋","果汁"],"answer":0,"explanation":"Câu đầy đủ là “请坐一下。”.","source":"Bài 17"},{"section":"Pinyin","type":"pinyin","prompt":"Pinyin đúng của “已经” là gì?","options":["yǐjīng","dítīng","bù hǎo yìsi","nánfāng"],"answer":0,"explanation":"Pinyin của “已经” là yǐjīng.","source":"Bài 19"},{"section":"Từ vựng","type":"meaning","prompt":"“随便” nghĩa là gì?","options":["đồng ý","tùy tiện","khoảng","thuận lợi"],"answer":1,"explanation":"“随便” đọc là suíbiàn, nghĩa là “tùy tiện”.","source":"Bài 17"},{"section":"Ngữ pháp","type":"grammar","prompt":"Giải thích này thuộc điểm ngữ pháp nào? “就” nhấn mạnh sớm; “才” nhấn mạnh muộn, chậm.","options":["如果……的话，就……","就 / 才","年龄表达法","地点状语"],"answer":1,"explanation":"Điểm ngữ pháp là “就 / 才”.","source":"Bài 19"},{"section":"Ngữ pháp","type":"grammar","prompt":"Giải thích này thuộc điểm ngữ pháp nào? Cách nói làm cho ngữ khí tự nhiên, nhẹ hơn.","options":["动词重叠","反问句：不是……吗","了（1）","太……了"],"answer":0,"explanation":"Điểm ngữ pháp là “动词重叠”.","source":"Bài 16"},{"section":"Điền từ","type":"fill","prompt":"这是______。 Zhè shì lùshang. Đây là trên đường.","options":["路上","别客气","夜里","医院"],"answer":0,"explanation":"Câu đầy đủ là “这是路上。”.","source":"Bài 17"},{"section":"Bài khóa","type":"textbook","prompt":"Câu “你太幸福了！我每天在学校背生词啦，听写啦，做作业啦，考试啦……累死了。” nghĩa là gì? Nǐ tài xìngfú le! Wǒ měi tiān zài xuéxiào bèi shēngcí la, tīngxiě la, zuò zuòyè la, kǎoshì la... lèi sǐ le.","options":["Ở ký túc xá xem TV, giặt quần áo, làm bài tập, ngủ một chút.","Sang năm bạn bao nhiêu tuổi rồi?","Bạn hạnh phúc quá! Tôi mỗi ngày ở trường học thuộc từ mới, nghe viết, làm bài, thi... mệt chết mất.","Người Trung Quốc đều thích ăn sủi cảo à?"],"answer":2,"explanation":"“你太幸福了！我每天在学校背生词啦，听写啦，做作业啦，考试啦……累死了。” nghĩa là “Bạn hạnh phúc quá! Tôi mỗi ngày ở trường học thuộc từ mới, nghe viết, làm bài, thi... mệt chết mất.”.","source":"Bài 20"},{"section":"Từ vựng","type":"meaning","prompt":"“种” nghĩa là gì?","options":["loại, chủng loại","người khách","tuổi","thuốc"],"answer":0,"explanation":"“种” đọc là zhǒng, nghĩa là “loại, chủng loại”.","source":"Bài 18"},{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “đói”?","options":["饿","好好儿","幸福","做梦"],"answer":0,"explanation":"Đáp án đúng là “饿”, đọc là è.","source":"Bài 17"},{"section":"Từ vựng","type":"meaning","prompt":"“岁” nghĩa là gì?","options":["ngày lễ, ngày hội","mùi vị","tuổi","trà"],"answer":2,"explanation":"“岁” đọc là suì, nghĩa là “tuổi”.","source":"Bài 19"},{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “chết, mất”?","options":["饿","死","病人","别客气"],"answer":1,"explanation":"Đáp án đúng là “死”, đọc là sǐ.","source":"Bài 20"},{"section":"Từ vựng","type":"meaning","prompt":"“节” nghĩa là gì?","options":["trước","ngày lễ, ngày hội","trên","đông lạnh"],"answer":1,"explanation":"“节” đọc là jié, nghĩa là “ngày lễ, ngày hội”.","source":"Bài 18"},{"section":"Pinyin","type":"pinyin","prompt":"Pinyin đúng của “长” là gì?","options":["kěyǐ","dà","cháng","wúliáo"],"answer":2,"explanation":"Pinyin của “长” là cháng.","source":"Bài 19"},{"section":"Từ vựng","type":"meaning","prompt":"“电视” nghĩa là gì?","options":["nhân bánh","ti vi, vô tuyến","loại, chủng loại","làm việc"],"answer":1,"explanation":"“电视” đọc là diànshì, nghĩa là “ti vi, vô tuyến”.","source":"Bài 16"},{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “đi taxi”?","options":["想","同意","打车","热闹"],"answer":2,"explanation":"Đáp án đúng là “打车”, đọc là dǎ chē.","source":"Bài 17"},{"section":"Ngữ pháp","type":"grammar","prompt":"Giải thích này thuộc điểm ngữ pháp nào? Dùng để nói nếu điều kiện xảy ra thì có kết quả.","options":["地点状语","了（1）","如果……（的话），就……","会（1）"],"answer":2,"explanation":"Điểm ngữ pháp là “如果……（的话），就……”.","source":"Bài 20"},{"section":"Pinyin","type":"pinyin","prompt":"Pinyin đúng của “跳舞” là gì?","options":["hǎohāor","tiào wǔ","miànshí","gōngzuò"],"answer":1,"explanation":"Pinyin của “跳舞” là tiào wǔ.","source":"Bài 16"},{"section":"Điền từ","type":"fill","prompt":"我想______一下。 Wǒ xiǎng xíng yíxià. Tôi muốn được một chút/thử một chút.","options":["干净","跳舞","行","问"],"answer":2,"explanation":"Câu đầy đủ là “我想行一下。”.","source":"Bài 17"},{"section":"Từ vựng","type":"meaning","prompt":"“味道” nghĩa là gì?","options":["giặt, rửa","mùi vị","bác sĩ","mì sợi"],"answer":1,"explanation":"“味道” đọc là wèidao, nghĩa là “mùi vị”.","source":"Bài 18"},{"section":"Nhận diện chữ Hán","type":"hanzi","prompt":"Từ nào có nghĩa “trên đường”?","options":["请进","客气","路上","做梦"],"answer":2,"explanation":"Đáp án đúng là “路上”, đọc là lùshang.","source":"Bài 17"},{"section":"Bài khóa","type":"textbook","prompt":"Câu “别客气。不上课，也没有作业，挺舒服的吧？” nghĩa là gì? Bié kèqi. Bù shàngkè, yě méiyǒu zuòyè, tǐng shūfu de ba?","options":["Nếu muốn ăn, có thể đi siêu thị mua sủi cảo đông lạnh.","Đừng khách sáo. Không đi học, cũng không có bài tập, khá thoải mái nhỉ?","Các em biết gói sủi cảo không? Trưa ăn sủi cảo ở nhà thầy/cô nhé?","Ở bệnh viện bạn làm những gì?"],"answer":1,"explanation":"“别客气。不上课，也没有作业，挺舒服的吧？” nghĩa là “Đừng khách sáo. Không đi học, cũng không có bài tập, khá thoải mái nhỉ?”.","source":"Bài 20"},{"section":"Pinyin","type":"pinyin","prompt":"Pinyin đúng của “工作” là gì?","options":["gōngzuò","kàn","tóngyì","shēngcí"],"answer":0,"explanation":"Pinyin của “工作” là gōngzuò.","source":"Bài 19"},{"section":"Điền từ","type":"fill","prompt":"______很重要。 dítīng hěn zhòngyào. sàn nhảy rất quan trọng.","options":["迪厅","试","习惯","别"],"answer":0,"explanation":"Câu đầy đủ là “迪厅很重要。”.","source":"Bài 16"},{"section":"Bài khóa","type":"textbook","prompt":"Câu “玛丽，怎么样？现在好一点儿了吗？” nghĩa là gì? Mǎlì, zěnmeyàng? Xiànzài hǎo yìdiǎnr le ma?","options":["Mary, thế nào rồi? Bây giờ đỡ hơn chút nào chưa?","Bạn chẳng phải bệnh nhân sao? Sức khỏe không tốt, còn phải uống thuốc... ăn mì đi!","Có lúc đi dạo cửa hàng với bạn, có lúc đến thư viện học.","Cuối tuần bạn thường làm gì?"],"answer":0,"explanation":"“玛丽，怎么样？现在好一点儿了吗？” nghĩa là “Mary, thế nào rồi? Bây giờ đỡ hơn chút nào chưa?”.","source":"Bài 20"},{"section":"Điền từ","type":"fill","prompt":"我______你的主意。 Wǒ tóngyì nǐ de zhǔyi. Tôi đồng ý với ý kiến của bạn.","options":["大家","同意","挤","对了"],"answer":1,"explanation":"Câu đầy đủ là “我同意你的主意。”.","source":"Bài 20"},{"section":"Từ vựng","type":"meaning","prompt":"“茶” nghĩa là gì?","options":["mì sợi","buồn chán, vô vị","trà","khiêu vũ, nhảy"],"answer":2,"explanation":"“茶” đọc là chá, nghĩa là “trà”.","source":"Bài 17"}];const letters=["A","B","C","D"];const state={};
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
function render(){const root=document.getElementById("quiz");let section="";root.innerHTML="";quizData.forEach((q,i)=>{if(q.section!==section){section=q.section;root.insertAdjacentHTML("beforeend",'<div class="section-title"><h2>'+esc(section)+'</h2><span></span></div>')}const opts=q.options.map((o,j)=>'<label class="option" id="q-'+i+'-o-'+j+'"><input type="radio" name="q-'+i+'" onchange="state['+i+']='+j+'"> <span><b>'+letters[j]+'.</b> '+esc(o)+'</span></label>').join("");root.insertAdjacentHTML("beforeend",'<article class="card" id="q-'+i+'"><div class="meta">Câu '+(i+1)+' · '+esc(q.type)+' · '+esc(q.source)+'</div><div class="exercise-q">'+esc(q.prompt)+'</div><div class="options">'+opts+'</div><div class="explain" id="q-'+i+'-ex"></div></article>')})}
function submitQuiz(){let correct=0;quizData.forEach((q,i)=>{const selected=state[i];q.options.forEach((_,j)=>{const el=document.getElementById("q-"+i+"-o-"+j);el.classList.remove("correct","wrong");if(j===q.answer)el.classList.add("correct");if(selected===j&&selected!==q.answer)el.classList.add("wrong")});if(selected===q.answer)correct++;const ex=document.getElementById("q-"+i+"-ex");ex.innerHTML='<b>'+(selected===q.answer?'Đúng':'Chưa đúng')+'.</b><br>Bạn chọn: '+esc(selected===undefined?'Chưa chọn':letters[selected]+'. '+q.options[selected])+'<br>Đáp án đúng: '+esc(letters[q.answer]+'. '+q.options[q.answer])+'<br>Giải thích: '+esc(q.explanation);ex.classList.add("show")});const pct=Math.round(correct/quizData.length*100);const r=document.getElementById("result");r.innerHTML='<b>'+correct+'/'+quizData.length+' câu đúng · '+pct+'%</b><br>Đáp án và giải thích đã hiện dưới từng câu.';r.classList.add("show");r.scrollIntoView({behavior:"smooth",block:"center"})}
function resetQuiz(){for(const k of Object.keys(state))delete state[k];document.querySelectorAll("input").forEach(i=>i.checked=false);document.querySelectorAll(".option").forEach(o=>o.classList.remove("correct","wrong"));document.querySelectorAll(".explain").forEach(e=>{e.classList.remove("show");e.innerHTML=""});document.getElementById("result").classList.remove("show");scrollTo({top:0,behavior:"smooth"})}
render();
</script>
